<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilzgarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEAF8; --bg2:#D9D0F3; --surface:#FFFFFF; --surface2:#F5F2FC;
  --ink:#2A2447; --muted:#6B6390; --line:#DDD6F0;
  --glow:#1FA89A; --amber:#D9811A; --pink:#D6457E;
  --cap1:#F79BBE; --cap2:#C9437A; --stem:#FBF3E4; --gill:#E7C9D6;
  --poor:.45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1735; --bg2:#2B2657; --surface:#26224A; --surface2:#2F2A5A;
    --ink:#EFEAFF; --muted:#A79FD0; --line:#3A3569;
    --glow:#7FE3D6; --amber:#FFB85C; --pink:#F28DB2;
    --cap1:#FF9CC4; --cap2:#B23A78; --stem:#EDE3F7; --gill:#8C5A86;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1735; --bg2:#2B2657; --surface:#26224A; --surface2:#2F2A5A;
  --ink:#EFEAFF; --muted:#A79FD0; --line:#3A3569;
  --glow:#7FE3D6; --amber:#FFB85C; --pink:#F28DB2;
  --cap1:#FF9CC4; --cap2:#B23A78; --stem:#EDE3F7; --gill:#8C5A86;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;font-family:"Fredoka",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%) fixed,var(--bg);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px;border-radius:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto;padding:12px 18px 0}
.brand{font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.topr{display:flex;align-items:center;gap:10px}
.seeds{font-size:.95rem;color:var(--muted);font-weight:500}
.seeds b{color:var(--amber)}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1rem}

.layout{display:grid;grid-template-columns:1fr;gap:16px;max-width:1100px;margin:0 auto;padding:6px 14px 32px}
@media(min-width:860px){.layout{grid-template-columns:1fr 440px;align-items:start}.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}

.stage{text-align:center;padding-top:4px}
.count{font-size:clamp(2.4rem,9vw,3.8rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count-label{font-size:1rem;color:var(--muted);margin-top:4px}
.rate{margin-top:8px;font-size:1.05rem;font-weight:500}
.rate span{color:var(--glow)}
.buffs{min-height:32px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.buff{background:var(--amber);color:#2A1A05;font-weight:600;font-size:.9rem;padding:4px 12px;border-radius:999px}
.buff.pink{background:var(--pink);color:#fff}

.scene{position:relative;height:clamp(280px,48vh,380px);margin-top:4px}
#garden{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mush{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;
  width:min(56vw,250px);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 0 22px color-mix(in srgb,var(--glow) 55%,transparent));animation:breathe 3.6s ease-in-out infinite}
.mush.rush{animation:none;filter:drop-shadow(0 0 30px var(--pink)) drop-shadow(0 0 12px var(--amber))}
.mush svg{width:100%;height:auto;display:block;pointer-events:none}
@keyframes breathe{50%{filter:drop-shadow(0 0 34px color-mix(in srgb,var(--glow) 75%,transparent))}}

.meter{max-width:260px;margin:6px auto 0;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--pink));border-radius:999px;transition:width .12s}
.hint{color:var(--muted);font-size:.9rem;margin-top:6px;min-height:1.3em}

.panel{background:var(--surface);border-radius:22px;padding:10px;box-shadow:0 1px 0 var(--line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface2);border-radius:16px;padding:4px}
.tab{border:0;background:none;padding:9px 2px;border-radius:12px;font-weight:500;font-size:.82rem;cursor:pointer;position:relative;color:var(--muted);line-height:1.15}
.tab .e{display:block;font-size:1.15rem}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,80,.12)}
.tab .dot{position:absolute;top:5px;right:10%;width:9px;height:9px;border-radius:50%;background:var(--pink);display:none}
.tab.has .dot{display:block}
.pane{padding:10px 4px 4px}
.pane[hidden]{display:none}

.buybar{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px;color:var(--muted);font-size:.9rem}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:none;border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;cursor:pointer;position:relative}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.row.poor{cursor:default}
.row.poor .ico,.row.poor .info,.row.poor .cost{opacity:var(--poor)}
.ico{font-size:1.9rem;width:46px;height:46px;display:grid;place-items:center;background:var(--surface2);border-radius:14px;flex:none}
.info{flex:1;min-width:0}
.info strong{display:block;font-weight:600;font-size:1.02rem}
.info small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}
.side{text-align:right;flex:none}
.cost{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--pink);margin-right:5px;vertical-align:.08em}
.own{font-size:1.5rem;font-weight:600;color:var(--muted);line-height:1}
.prog{height:4px;border-radius:4px;background:var(--surface2);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--glow)}
.locked .info strong{letter-spacing:.2em}

.quest{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.quest:last-of-type{border-bottom:0}
.quest .info small b{color:var(--ink)}
.claim{border:0;border-radius:12px;padding:9px 14px;font-weight:600;background:var(--glow);color:#0B2B27;cursor:pointer;flex:none}
.claim:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.daily{display:flex;gap:6px;padding:12px 6px 4px}
.daily div{flex:1;text-align:center;border-radius:12px;padding:6px 0;background:var(--surface2);font-size:.75rem;color:var(--muted)}
.daily div b{display:block;font-size:1rem;color:var(--ink)}
.daily div.done{background:var(--glow);color:#0B2B27}
.daily div.done b{color:#0B2B27}
.sub{padding:12px 6px 2px;color:var(--muted);font-size:.9rem}

.empty{color:var(--muted);padding:18px 8px;line-height:1.45}
.achhead{padding:4px 6px 10px;color:var(--muted)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach{background:var(--surface2);border-radius:14px;padding:10px;font-size:.85rem;line-height:1.3}
.ach .e{font-size:1.5rem}
.ach b{display:block;font-weight:600;font-size:.95rem;margin:2px 0}
.ach span{color:var(--muted)}
.ach.off{opacity:.5}
.ach.off .e{filter:grayscale(1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:14px 6px 0;font-size:.9rem}
.stats span{color:var(--muted)}
.stats b{font-weight:600;text-align:right}

.season p{line-height:1.5;margin:0 6px 12px;max-width:60ch}
.season h3{margin:6px 6px 8px;font-size:1.25rem;font-weight:600}
.big{font-size:2rem;font-weight:600;color:var(--amber)}
.primary{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:600;font-size:1.05rem;background:var(--ink);color:var(--surface);cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--muted);margin:16px 6px 4px}

.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.float{position:absolute;font-weight:700;font-size:1.3rem;color:var(--ink);transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;text-shadow:0 0 8px var(--bg);white-space:nowrap}
.float.crit{font-size:1.9rem;color:var(--pink)}
@keyframes rise{to{transform:translate(-50%,-110px);opacity:0}}
.spore{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

.gold{position:fixed;z-index:25;width:74px;height:74px;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 0 16px var(--amber));animation:bob 1.6s ease-in-out infinite,fadein .4s ease-out}
.gold svg{width:100%;height:100%;pointer-events:none}
.mote{position:fixed;z-index:25;width:44px;height:44px;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.mote::after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,#FFF4C2,#FFB23D);box-shadow:0 0 14px #FFB23D}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes fadein{from{opacity:0;transform:scale(.4)}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,380px);pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:500;box-shadow:0 6px 20px rgba(20,10,50,.3);animation:tin .25s ease-out;width:100%;text-align:center}
.toast small{display:block;opacity:.75;font-weight:400}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(20,15,45,.55);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.card{background:var(--surface);border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center}
.card .bigemoji{font-size:3rem;line-height:1}
.card h2{margin:6px 0 8px;font-weight:600}
.card p{color:var(--muted);line-height:1.5;margin:0 0 18px}
.card .ghost{margin:10px 0 0;width:100%}


.phase{position:absolute;left:4px;top:4px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink)}
.slug{position:absolute;z-index:3;border:0;background:none;padding:0;font-size:30px;line-height:1;cursor:pointer;touch-action:manipulation;transform:translateX(-50%);width:44px;height:44px}
.slug span{display:inline-block}
.slug.eat span{animation:munch .5s ease-in-out infinite}
@keyframes munch{50%{transform:translateY(-3px) rotate(-6deg)}}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:0 0 14px;text-align:center}
.skin{border:2px solid transparent;background:var(--surface2);border-radius:16px;padding:10px 6px;cursor:pointer;font-size:.85rem;line-height:1.25}
.skin[aria-pressed="true"]{border-color:var(--glow)}
.skin:disabled{cursor:default;opacity:.55}
.skin i{display:block;width:44px;height:26px;margin:0 auto 6px;border-radius:44px 44px 8px 8px}
.skin small{display:block;color:var(--muted);font-size:.75rem}
.card.wide{max-width:460px;text-align:left}
.card.wide h2{text-align:center}
.card ul{color:var(--muted);line-height:1.5;padding-left:1.1em;margin:0 0 18px}

.dimbtn{position:absolute;right:4px;top:4px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
.dimbtn.new{box-shadow:0 0 0 3px var(--pink)}
.passbar{display:flex;align-items:center;gap:10px;max-width:320px;width:100%;margin:10px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 12px;cursor:pointer;position:relative}
.passbar .pl{font-weight:600;white-space:nowrap;font-size:.95rem}
.pbar{flex:1;height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.pbar i,.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB23D,var(--pink));border-radius:999px;transition:width .2s}
.passbar .pdot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--pink);color:#fff;font-size:.75rem;font-weight:700;display:none;place-items:center;padding:0 5px}
.passbar.has .pdot{display:grid}
.card.tall{max-height:88vh;overflow:auto}
.xpbar{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:4px 0 8px}
.passhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.passhead b{font-size:1.4rem}
.passhead span{color:var(--muted);font-size:.9rem}
.tier{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.tier .tn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--surface2);color:var(--muted);flex:none}
.tier.reached .tn{background:linear-gradient(135deg,#FFB23D,var(--pink));color:#fff}
.tier.cur{background:color-mix(in srgb,var(--pink) 10%,transparent);border-radius:12px}
.tier .ico{width:40px;height:40px;font-size:1.4rem}
.tier .ico svg{width:34px;height:auto}
.tier.claimed .info,.tier.claimed .ico{opacity:.45}
.xpnote{color:var(--muted);font-size:.85rem;line-height:1.4;margin:0 0 12px}
.skin.r-s{border-color:#5B8CFF55}.skin.r-e{border-color:#B25BFF77}.skin.r-l{border-color:#FFAA3399;background:linear-gradient(160deg,color-mix(in srgb,#FFB23D 18%,var(--surface2)),var(--surface2))}
.skin .pv{width:64px;margin:0 auto 4px}
.skin .pv svg{width:100%;height:auto;display:block}
.skin .rar{font-size:.7rem;font-weight:600}
.r-g .rar{color:var(--muted)}.r-s .rar{color:#5B8CFF}.r-e .rar{color:#B25BFF}.r-l .rar{color:#E8941A}
.skin[aria-pressed="true"]{border-color:var(--glow);border-width:3px}
.skin .lock{height:64px;display:grid;place-items:center;font-size:1.8rem;filter:grayscale(1);opacity:.6}
.mush.fx-rainbow svg{animation:hue 5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.mush.fx-neon{animation:none;filter:drop-shadow(0 0 8px #39F5FF) drop-shadow(0 0 22px #FF3DF2)}
.mush.fx-ghost svg{opacity:.72;animation:ghost 3s ease-in-out infinite}
@keyframes ghost{50%{transform:translateY(-8px)}}
.mush.fx-gold{animation:none;filter:drop-shadow(0 0 16px #FFC23D) drop-shadow(0 0 40px rgba(255,194,61,.5))}
.mush.fx-fire{animation:none;filter:drop-shadow(0 0 18px #FF7A1F)}
.mush.fx-ice{animation:none;filter:drop-shadow(0 0 16px #9FE8FF)}
.flames{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.12) skewX(3deg)}}
.sparkle{animation:spk 1.4s ease-in-out infinite}
@keyframes spk{50%{opacity:.15}}
@media (prefers-reduced-motion: reduce){.flames,.sparkle,.mush.fx-rainbow svg,.mush.fx-ghost svg{animation:none}}
@media (prefers-reduced-motion: reduce){.mush,.gold{animation:none}.spore{display:none}.float{animation-duration:.6s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span aria-hidden="true">🍄</span> Pilzgarten</div>
  <div class="topr">
    <div class="seeds" id="seedsTop" hidden>🌱 <b id="seedsNum">0</b></div>
    <button class="ibtn" id="skinBtn" aria-label="Pilz-Aussehen wählen">🎨</button>
    <button class="ibtn" id="muteBtn" aria-label="Ton aus">🔊</button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="count" id="count">0</div>
    <div class="count-label">Sporen</div>
    <div class="rate"><span id="sps">0</span> pro Sekunde</div>
    <div class="buffs" id="buffs"></div>
    <div class="scene" id="scene">
      <canvas id="garden" aria-hidden="true"></canvas>
      <button class="phase" id="phase"></button>
      <button class="dimbtn" id="dimBtn" aria-label="Dimension wechseln">🌲 Pilzwald</button>
      <button class="mush" id="mush" aria-label="Pilz antippen und Sporen sammeln"></button>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <button class="passbar" id="passBar" aria-label="Sporen-Pass öffnen"><span class="pl">⭐ Stufe <b id="pTier">0</b></span><span class="pbar"><i id="pFill"></i></span><span class="pdot" id="pDot">!</span></button>
    <div class="hint" id="hint">Tippe den Pilz an. Schnelles Tippen füllt den Sporenrausch.</div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-pane="p-b"><span class="e">🌿</span>Züchter<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-u" id="tabU"><span class="e">⬆️</span>Upgrades<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-q" id="tabQ"><span class="e">📜</span>Aufgaben<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-a"><span class="e">🏆</span>Erfolge<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-s" id="tabS"><span class="e">🌅</span>Saison<i class="dot"></i></button>
    </div>
    <div class="pane" id="p-b">
      <div class="buybar"><span>Menge kaufen</span>
        <div class="seg"><button data-n="1" aria-pressed="true">1×</button><button data-n="10" aria-pressed="false">10×</button><button data-n="max" aria-pressed="false">Max</button></div>
      </div>
      <div id="blist"></div>
    </div>
    <div class="pane" id="p-u" hidden><div id="ulist"></div></div>
    <div class="pane" id="p-q" hidden><div id="qlist"></div></div>
    <div class="pane" id="p-a" hidden>
      <div class="achhead" id="achhead"></div>
      <div class="achgrid" id="agrid"></div>
      <div class="stats" id="stats"></div>
      <button class="ghost" id="reset">Spielstand löschen</button>
    </div>
    <div class="pane season" id="p-s" hidden></div>
  </section>
</main>

<div class="modal" id="skinModal" hidden>
  <div class="card wide" role="dialog" aria-modal="true" aria-labelledby="skT">
    <h2 id="skT">Deine Pilze</h2>
    <p>Jeder freigeschaltete Pilz bringt dauerhaft +2 % Produktion.</p>
    <div class="skins" id="skinGrid"></div>
    <button class="primary" id="skinClose">Fertig</button>
  </div>
</div>
<div class="modal" id="passModal" hidden>
  <div class="card wide tall" role="dialog" aria-modal="true" aria-labelledby="paT">
    <h2 id="paT">⭐ Sporen-Pass</h2>
    <div class="passhead"><b id="paTier"></b><span id="paEnd"></span></div>
    <div class="xpbar"><i id="paFill"></i></div>
    <p class="xpnote" id="paXp"></p>
    <button class="primary" id="claimAll">Alle abholen</button>
    <div id="tiers" style="margin-top:10px"></div>
    <button class="ghost" id="passClose" style="width:100%;margin:12px 0 0">Schließen</button>
  </div>
</div>
<div class="modal" id="dimModal" hidden>
  <div class="card wide tall" role="dialog" aria-modal="true" aria-labelledby="diT">
    <h2 id="diT">🌀 Dimensionen</h2>
    <p>Jede Dimension hat einen eigenen Vorteil. Du kannst jederzeit reisen.</p>
    <div id="dimList"></div>
    <button class="ghost" id="dimClose" style="width:100%;margin:12px 0 0">Schließen</button>
  </div>
</div>
<div class="fx" id="fx"></div>
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden>

const CYCLE=240;
function phase(){return (Date.now()/1000%CYCLE)/CYCLE}
function isNight(){return phase()>=.5}
function nightAmt(){const p=phase();return p<.45?0:p<.55?(p-.45)/.1:p<.95?1:(1-p)/.05}
function phaseMult(id){if(isNight())return ['wurm','mond','geist'].includes(id)?2:1;return ['moos','igel','wind'].includes(id)?1.5:1}

function save(){S.last=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

const now=()=>Date.now();

const U=['','Tsd.','Mio.','Mrd.','Bio.','Brd.','Trill.','Trd.','Quadr.','Quadrd.','Quint.'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<10&&n%1!==0)return (Math.floor(n*10)/10).toFixed(1).replace('.',',');
  if(n<1e6)return Math.floor(n).toLocaleString('de-DE');
  const e=Math.floor(Math.log10(n)/3);
  if(e>=U.length)return n.toExponential(2).replace('.',',');
  return (n/Math.pow(10,e*3)).toFixed(2).replace('.',',')+' '+U[e];
}
function fmtTime(sec){if(sec<90)return Math.round(sec)+' Sekunden';if(sec<5400)return Math.round(sec/60)+' Minuten';return (sec/3600).toFixed(1).replace('.',',')+' Stunden'}

/* ---------- economy ---------- */
function mileMult(b){const o=S.owned[b.id]||0;let m=1;for(const x of MILE)if(o>=x)m*=1.5;return m}
function bRate(b){let r=b.rate;for(let i=0;i<5;i++)if(has(b.id+i))r*=2;return r*mileMult(b)*phaseMult(b.id)}
function baseMult(){return (1+S.seeds*0.1)*(1+S.ach.length*0.03)*(1+(S.skins.length-1)*0.02)*(dim()==='tiefsee'?1.5:1)*(dim()==='kosmos'?2:1)}
function rawSps(){let t=0;for(const b of B)t+=(S.owned[b.id]||0)*bRate(b);return t*baseMult()}
let slugsArr=[];
const slugFactor=()=>Math.pow(.85,slugsArr.filter(o=>!o.dead).length);
function sps(){return rawSps()*(now()<buffs.frenzy?7:1)*slugFactor()}
function rushPow(){return has('r1')?10:5}
function tapBase(){
  let base=1,pct=0;
  for(const u of UP){if(!has(u.id))continue;if(u.type==='tapx')base*=2;if(u.type==='tappct')pct+=u.val}
  let v=base*(1+S.seeds*0.1)+sps()*pct;
  if(now()<buffs.tap)v*=50;
  if(now()<buffs.rush)v*=rushPow();
  if(dim()==='lava')v*=3;
  return v;
}
function critChance(){let c=0;for(const u of UP)if(u.type==='crit'&&has(u.id))c+=u.val;return c+(dim()==='kristall'?.1:0)}
function gain(n){S.spores+=n;S.season+=n;S.allTime+=n}
function costOf(b,k){const o=S.owned[b.id]||0,r=1.15;return Math.ceil(b.base*Math.pow(r,o)*(Math.pow(r,k)-1)/(r-1))}
function maxAfford(b){const o=S.owned[b.id]||0,r=1.15,c0=b.base*Math.pow(r,o);const k=Math.floor(Math.log(S.spores*(r-1)/c0+1)/Math.log(r));return Math.max(0,k)}

/* ---------- audio ---------- */
let actx=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function tone(f,dur,type,vol,delay,slide){
  if(S.muted||!actx)return;const t0=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.1,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+.02);
}
const sfx={
  tap:()=>tone(520+Math.random()*160+meter*300,.09,'sine',.07,0,1.6),
  crit:()=>{tone(880,.12,'triangle',.1);tone(1320,.16,'triangle',.08,.05)},
  buy:()=>{tone(440,.08,'square',.04);tone(660,.1,'square',.04,.06)},
  gold:()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,.25,'sine',.08,i*.07))},
  ach:()=>{[523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.07,i*.09))},
  rush:()=>{tone(200,.6,'sawtooth',.05,0,4);tone(400,.5,'sine',.07,.1,3)},
  mote:()=>tone(1200+Math.random()*400,.08,'sine',.07,0,1.3)
};
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

$('muteBtn').onclick=()=>{S.muted=!S.muted;ensureAudio();updMute();save()};

/* ---------- tapping ---------- */
const mush=$('mush'),fx=$('fx');
function floatText(x,y,txt,cls){if(fx.childElementCount>80)return;const f=document.createElement('div');f.className='float'+(cls?' '+cls:'');f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';fx.appendChild(f);f.addEventListener('animationend',()=>f.remove())}
function sporeBurst(x,y,n){if(reduced||fx.childElementCount>80)return;for(let i=0;i<n;i++){const p=document.createElement('div');p.className='spore';const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
  p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-30+'px');fx.appendChild(p);p.addEventListener('animationend',()=>p.remove())}}
function tap(x,y){
  ensureAudio();
  let v=tapBase(),crit=Math.random()<critChance();
  if(crit){v*=10;S.crits++}
  gain(v);S.taps++;addXP(.25);
  if(now()>=buffs.rush){meter=Math.min(1,meter+0.045);if(meter>=1)startRush()}
  if(mush.animate)mush.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(.93,.9)'},{transform:'translateX(-50%) scale(1.02)'},{transform:'translateX(-50%) scale(1)'}],{duration:180});
  floatText(x,y,'+'+fmt(v),crit?'crit':'');sporeBurst(x,y,crit?10:5);
  crit?sfx.crit():sfx.tap();buzz(crit?25:6);
  if(S.taps===1)$('hint').textContent='Weiter so! Kauf bald deinen ersten Züchter.';
  if(S.taps===40)$('hint').textContent='Halte Ausschau nach goldenen Pilzen.';
}
function startRush(){
  meter=0;S.rushes++;addXP(15);const len=(has('r0')?13:8)*1000;buffs.rush=now()+len;
  mush.classList.add('rush');sfx.rush();buzz([30,40,30]);toast('💫 Sporenrausch!',`Tippen zählt ${rushPow()}-fach`);
  setTimeout(()=>{if(now()>=buffs.rush-50)mush.classList.remove('rush')},len);
}
mush.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY)});
mush.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=mush.getBoundingClientRect();tap(r.left+r.width/2,r.top+r.height/3)}});

const blist=$('blist');let bVisible=-1;
function visibleCount(){let n=1;B.forEach((b,i)=>{if((S.owned[b.id]||0)>0||S.allTime>=b.base*0.6)n=Math.max(n,i+1)});return Math.min(B.length,n+1)}
function amountFor(b){return buyN==='max'?Math.max(1,maxAfford(b)):buyN}
function buildBList(){
  const n=visibleCount();if(n===bVisible)return;bVisible=n;blist.innerHTML='';
  B.slice(0,n).forEach((b,i)=>{
    const unlocked=(S.owned[b.id]||0)>0||S.allTime>=b.base*0.6||i===0;
    const r=document.createElement('button');r.className='row'+(unlocked?'':' locked');r.dataset.id=b.id;
    r.innerHTML=unlocked
      ?`<span class="ico" aria-hidden="true">${b.icon}</span><span class="info"><strong>${b.name}</strong><small class="ds"></small><div class="prog"><i></i></div></span><span class="side"><div class="own"></div><div class="cost"></div></span>`
      :`<span class="ico" aria-hidden="true">❔</span><span class="info"><strong>???</strong><small>Sammle mehr Sporen, um diesen Züchter zu entdecken.</small></span><span class="side"><div class="cost"></div></span>`;
    if(unlocked)r.addEventListener('click',e=>{
      const k=amountFor(b),c=costOf(b,k);if(S.spores<c)return;
      const before=S.owned[b.id]||0;S.spores-=c;S.owned[b.id]=before+k;addXP(Math.min(10,k));sfx.buy();buzz(8);
      const hit=MILE.find(m=>before<m&&before+k>=m);
      if(hit)toast(`${b.icon} ${hit} ${b.name}!`,`${b.name} produziert jetzt 50 % mehr`);
      const rc=r.getBoundingClientRect();floatText(e.clientX||rc.right-40,(e.clientY||rc.top)-6,'+'+k+' '+b.icon);
      render();
    });else r.disabled=true;
    blist.appendChild(r);
  });
}
function updBList(){
  buildBList();
  blist.querySelectorAll('.row').forEach(r=>{
    const b=B.find(x=>x.id===r.dataset.id);

    r.querySelector('.prog i').style.width=nm?((o-pm)/(nm-pm)*100)+'%':'100%';
    r.classList.toggle('poor',S.spores<c);

/* ---------- quests ---------- */
function progOf(q){
  switch(q.type){
    case 'tap':return S.taps-q.start;
    case 'buy':return (S.owned[q.target]||0)-q.start;
    case 'earn':return S.allTime-q.start;
    case 'gold':return S.golden-q.start;
    case 'rush':return S.rushes-q.start;
    case 'upg':return S.up.length-q.start;
  }return 0;
}
function questText(q){
  const b=B.find(x=>x.id===q.target);
  switch(q.type){
    case 'tap':return ['👆',`Tippe ${q.need}-mal auf den Pilz`];
    case 'buy':return [b.icon,`Kaufe ${q.need} × ${b.name}`];
    case 'earn':return ['🧺',`Sammle ${fmt(q.need)} Sporen`];
    case 'gold':return ['🟡','Fang einen Goldpilz'];
    case 'rush':return ['💫','Löse den Sporenrausch aus'];
    case 'upg':return ['⬆️','Kaufe ein Upgrade'];
  }
}
function newQuest(){
  const pool=['tap','buy','earn','earn','buy','rush'];
  if(S.golden>0)pool.push('gold');if(availUps().length)pool.push('upg');
  const used=S.quests.map(q=>q.type);let type,tries=0;
  do{type=pool[Math.random()*pool.length|0];tries++}while(used.includes(type)&&tries<12);
  const q={type,need:1,start:0,secs:60,target:null};
  if(type==='tap'){q.need=[30,60,100,150][Math.random()*4|0];q.start=S.taps;q.secs=45}
  if(type==='buy'){const vis=B.filter(b=>(S.owned[b.id]||0)>0||S.allTime>=b.base*0.6);const b=vis[Math.max(0,vis.length-1-(Math.random()*2|0))]||B[0];
    q.target=b.id;q.need=[3,5,10][Math.random()*3|0];q.start=S.owned[b.id]||0;q.secs=90}
  if(type==='earn'){q.need=Math.max(200,Math.round(rawSps()*(90+Math.random()*120)));q.start=S.allTime;q.secs=80}
  if(type==='gold'){q.start=S.golden;q.secs=180}
  if(type==='rush'){q.start=S.rushes;q.secs=70}
  if(type==='upg'){q.start=S.up.length;q.secs=60}
  return q;
}
function questReward(q){return Math.max(rawSps()*q.secs,tapBase()*q.secs*0.6,75)}
function fillQuests(){while(S.quests.length<3)S.quests.push(newQuest())}
const qlist=$('qlist');let qKey='';
function updQuests(){
  fillQuests();
  const ready=S.quests.some(q=>progOf(q)>=q.need);
  $('tabQ').classList.toggle('has',ready||dailyAvailable());
  if($('p-q').hidden)return;
  const key=S.quests.map(q=>q.type+Math.min(q.need,progOf(q))).join('|')+S.dailyStreak;
  if(key===qKey)return;qKey=key;
  let h='';
  S.quests.forEach((q,i)=>{
    const [e,t]=questText(q),p=Math.min(q.need,progOf(q)),done=p>=q.need;
    h+=`<div class="quest"><span class="ico">${e}</span><span class="info"><strong>${t}</strong><small>Belohnung: <b>${fmt(questReward(q))}</b> Sporen</small><div class="prog"><i style="width:${p/q.need*100}%"></i></div></span><button class="claim" data-q="${i}" ${done?'':'disabled'}>${done?'Abholen':fmt(p)+'/'+fmt(q.need)}</button></div>`;
  });
  const day=Math.min(S.dailyStreak,7);
  h+=`<div class="sub">Tagesbonus: Komm jeden Tag wieder. An Tag 7 gibt es einen Sternensamen.</div><div class="daily">${[1,2,3,4,5,6,7].map(d=>`<div class="${d<=day?'done':''}"><b>${d===7?'🌱':'🎁'}</b>Tag ${d}</div>`).join('')}</div>`;
  qlist.innerHTML=h;
  qlist.querySelectorAll('.claim').forEach(btn=>btn.addEventListener('click',e=>{
    const i=+btn.dataset.q,q=S.quests[i];if(progOf(q)<q.need)return;
    const r=questReward(q);gain(r);S.questsDone++;addXP(40);S.quests.splice(i,1,newQuest());
    sfx.gold();buzz([15,30,15]);floatText(e.clientX,e.clientY-10,'+'+fmt(r),'crit');toast('📜 Aufgabe erledigt',`+${fmt(r)} Sporen`);qKey='';render();
  }));
}

/* ---------- daily ---------- */
function today(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dayIndex(v){if(!v)return null;const y=Math.floor(v/10000),m=Math.floor(v/100)%100-1,d=v%100;return Math.round(Date.UTC(y,m,d)/864e5)}
function dailyAvailable(){return S.dailyDay!==today()}
function checkDaily(){
  if(!dailyAvailable())return;
  const t=today(),prev=dayIndex(S.dailyDay),cur=dayIndex(t);
  S.dailyStreak=(prev!==null&&cur-prev===1)?S.dailyStreak+1:1;
  S.dailyDay=t;
  const d=((S.dailyStreak-1)%7)+1,amt=Math.max(100*d,rawSps()*60*d);
  gain(amt);addXP(60);let extra='';
  if(d===7){S.seeds++;extra=' Dazu gibt es einen Sternensamen!'}
  save();
  queueModal({emoji:d===7?'🌱':'🎁',title:`Tagesbonus: Tag ${d}`,text:`Du bekommst ${fmt(amt)} Sporen.${extra} Morgen wird der Bonus größer.`,ok:'Einsammeln',onOk:()=>sfx.gold()});
}

  if(r<0.3){const amt=Math.max(rawSps()*120,tapBase()*40,77);gain(amt);toast('🟡 Sporenregen!',`+${fmt(amt)} Sporen`);floatText(x,y,'+'+fmt(amt),'crit')}
  else if(r<0.58){buffs.frenzy=now()+30000*dur;toast('🟡 Pilzrausch!',`7-fache Produktion für ${30*dur} Sekunden`)}

  else{toast('🐝 Goldschwarm!','Fang so viele Goldsporen wie möglich');swarm(10+(dur-1)*6)}

function swarm(n){
  const motes=[];const val=Math.max(rawSps()*8,tapBase()*8,10);
  for(let i=0;i<n;i++){
    const m=document.createElement('button');m.className='mote';m.setAttribute('aria-label','Goldspore fangen');
    const o={el:m,x:Math.random()*innerWidth,y:innerHeight*(.15+Math.random()*.7),vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*3,ph:Math.random()*6};
    m.addEventListener('pointerdown',e=>{e.preventDefault();m.remove();o.dead=true;gain(val);S.motes++;sfx.mote();buzz(8);floatText(e.clientX,e.clientY,'+'+fmt(val))});
    document.body.appendChild(m);motes.push(o);
  }
  const end=now()+7000;
  (function step(){
    const t=now();
    for(const o of motes){if(o.dead)continue;
      o.ph+=.05;o.x+=o.vx+Math.sin(o.ph)*1.5;o.y+=o.vy+Math.cos(o.ph*1.3)*1.2;
      if(o.x<0||o.x>innerWidth-44)o.vx*=-1;if(o.y<40||o.y>innerHeight-60)o.vy*=-1;
      o.el.style.transform=`translate(${o.x}px,${o.y}px)`;o.el.style.left='0';o.el.style.top='0';
      if(t>end-1500)o.el.style.opacity=String(Math.max(0,(end-t)/1500));
    }
    if(t<end&&motes.some(o=>!o.dead))requestAnimationFrame(step);else motes.forEach(o=>o.el.remove());
  })();
}

/* ---------- battle pass ---------- */
const PASS=[null,
  {t:'sp',s:60},{t:'skin',id:'cool'},{t:'sp',s:120},{t:'gold'},{t:'dim',id:'kristall'},
  {t:'skin',id:'ninja'},{t:'sp',s:300},{t:'seed',n:1},{t:'skin',id:'pirat'},{t:'skin',id:'koenig'},
  {t:'sp',s:600},{t:'dim',id:'lava'},{t:'skin',id:'engel'},{t:'frenzy',s:60},{t:'skin',id:'teufel'},
  {t:'seed',n:2},{t:'skin',id:'zylinder'},{t:'dim',id:'wolken'},{t:'sp',s:1200},{t:'skin',id:'flamme'},
  {t:'skin',id:'geist'},{t:'seed',n:2},{t:'skin',id:'eis'},{t:'dim',id:'tiefsee'},{t:'skin',id:'cyber'},
  {t:'sp',s:3000},{t:'seed',n:3},{t:'skin',id:'regen'},{t:'skin',id:'drache'},{t:'dim',id:'kosmos'}
];
const MAXT=30,SEASON_MS=14*864e5,PASS_EPOCH=Date.UTC(2026,0,5);
function passTierFor(type,id){for(let i=1;i<=MAXT;i++)if(PASS[i].t===type&&PASS[i].id===id)return i;return 0}
function passSeasonIdx(){return Math.floor((Date.now()-PASS_EPOCH)/SEASON_MS)}
function passEndsIn(){const end=PASS_EPOCH+(passSeasonIdx()+1)*SEASON_MS,ms=end-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d>0?`${d} T ${h} Std`:`${h} Std ${Math.floor(ms%36e5/6e4)} Min`}
function tierCost(t){return 50+t*8}
function tierInfo(){let xp=S.xp,t=0;while(t<MAXT&&xp>=tierCost(t)){xp-=tierCost(t);t++}
  if(t>=MAXT){const b=Math.floor(xp/400);return {tier:MAXT,bonus:b,into:xp-b*400,need:400}}
  return {tier:t,bonus:0,into:xp,need:tierCost(t)}}
function addXP(n){const b=tierInfo();S.xp+=n;const a=tierInfo();
  if(a.tier>b.tier||a.bonus>b.bonus){sfx.ach();buzz([20,40,20]);toast(a.tier>b.tier?`⭐ Pass-Stufe ${a.tier} erreicht!`:'⭐ Bonusstufe erreicht!','Tippe auf den Pass, um die Belohnung abzuholen')}}
function claimable(){const ti=tierInfo();let n=0;for(let i=1;i<=ti.tier;i++)if(!S.claimed.includes(i))n++;return n+Math.max(0,ti.bonus-S.bonusClaimed)}
function checkPassSeason(){const i=passSeasonIdx();if(S.passSeason!==i){const had=S.passSeason!==null;S.passSeason=i;S.xp=0;S.claimed=[];S.bonusClaimed=0;
  if(had)queueModal({emoji:'⭐',title:'Neue Pass-Saison!',text:'Der Sporen-Pass beginnt von vorn. Alle Pilze und Dimensionen, die du schon hast, behältst du.',ok:'Weiter'})}}
function rewardInfo(r,p){
  switch(r.t){
    case 'sp':return ['🧺',`Sporen für ${Math.round(r.s/60)} Min. Produktion`];
    case 'skin':{const k=SKINS.find(x=>x.id===r.id);return [mushSVG(k,p||'rw'),`${RAR[k.rar]}er Pilz: ${k.name}`.replace('Gewöhnlicher','Gewöhnlicher').replace('Legendärer','Legendärer')]}
    case 'dim':{const d=DIMS.find(x=>x.id===r.id);return [d.e,`Dimension: ${d.name}`]}
    case 'seed':return ['🌱',`${r.n} Sternensamen`];
    case 'gold':return ['🟡','Ein Goldpilz sofort'];
    case 'frenzy':return ['🔥',`${r.s} Sekunden Pilzrausch`];
  }
}
function spAmount(sec){return Math.max(rawSps()*sec,tapBase()*sec*.5,sec*2)}
function grant(r){
  switch(r.t){
    case 'sp':{const a=spAmount(r.s);gain(a);toast('🧺 Belohnung',`+${fmt(a)} Sporen`);break}
    case 'skin':if(!unlockSkin(r.id)){const a=spAmount(300);gain(a);toast('🎨 Pilz schon vorhanden',`Dafür +${fmt(a)} Sporen`)}break;
    case 'dim':if(!S.dims.includes(r.id)){S.dims.push(r.id);const d=DIMS.find(x=>x.id===r.id);toast(`🌀 Neue Dimension: ${d.name}`,'Tippe oben rechts in der Szene, um zu reisen');$('dimBtn').classList.add('new')}else{const a=spAmount(300);gain(a);toast('🌀 Dimension schon offen',`Dafür +${fmt(a)} Sporen`)}break;
    case 'seed':S.seeds+=r.n;toast('🌱 Sternensamen',`+${r.n}, das sind +${r.n*10} % Produktion für immer`);break;
    case 'gold':spawnGold();toast('🟡 Da ist ein Goldpilz!','Schnell, fang ihn');break;
    case 'frenzy':buffs.frenzy=Math.max(now(),buffs.frenzy)+r.s*1000;toast('🔥 Pilzrausch!',`7-fache Produktion für ${r.s} Sekunden`);break;
  }
}
function claimTier(i){if(S.claimed.includes(i)||tierInfo().tier<i)return;S.claimed.push(i);grant(PASS[i]);sfx.gold()}
function claimBonus(){const ti=tierInfo();if(ti.bonus<=S.bonusClaimed)return;S.bonusClaimed++;const a=spAmount(600);gain(a);let x='';if(Math.random()<.25){S.seeds++;x=' und 1 Sternensamen'}toast('⭐ Bonusstufe',`+${fmt(a)} Sporen${x}`);sfx.gold()}
function openPass(){renderPass(true);$('passModal').hidden=false}
function renderPass(scroll){
  const ti=tierInfo();
  $('paTier').textContent=ti.tier>=MAXT?`Stufe 30, Bonus ${ti.bonus}`:`Stufe ${ti.tier} von ${MAXT}`;
  $('paEnd').textContent='Saison endet in '+passEndsIn();
  $('paFill').style.width=(ti.into/ti.need*100)+'%';
  $('paXp').textContent=`${Math.floor(ti.into)} von ${ti.need} XP bis zur nächsten Stufe. XP gibt es fürs Tippen, Kaufen, Aufgaben, Goldpilze, Schnecken, Glühwürmchen, Erfolge und den Tagesbonus.`;
  const c=claimable();$('claimAll').disabled=!c;$('claimAll').textContent=c?`Alle abholen (${c})`:'Nichts abzuholen';
  let h='';
  for(let i=1;i<=MAXT;i++){const r=PASS[i],[e,n]=rewardInfo(r,'ps'+i),reached=ti.tier>=i,cl=S.claimed.includes(i);
    h+=`<div class="tier ${reached?'reached':''} ${cl?'claimed':''} ${i===ti.tier+1?'cur':''}" id="tier${i}"><span class="tn">${i}</span><span class="ico">${e}</span><span class="info"><strong>${n}</strong></span>${cl?'<span aria-label="abgeholt">✅</span>':reached?`<button class="claim" data-t="${i}">Abholen</button>`:`<span aria-label="gesperrt">🔒</span>`}</div>`}
  const bc=Math.max(0,ti.bonus-S.bonusClaimed);
  h+=`<div class="tier ${ti.tier>=MAXT?'reached':''}"><span class="tn">∞</span><span class="ico">⭐</span><span class="info"><strong>Bonusstufen</strong><small>Alle 400 XP nach Stufe 30: Sporen und vielleicht ein Sternensamen</small></span>${bc?`<button class="claim" data-b="1">Abholen (${bc})</button>`:''}</div>`;
  $('tiers').innerHTML=h;
  $('tiers').querySelectorAll('.claim').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.b)claimBonus();else claimTier(+b.dataset.t);renderPass();render()}));
  if(scroll){const el=$('tier'+Math.min(MAXT,Math.max(1,ti.tier)));if(el)setTimeout(()=>el.scrollIntoView({block:'center'}),30)}
}
$('claimAll').onclick=()=>{const ti=tierInfo();for(let i=1;i<=ti.tier;i++)claimTier(i);while(tierInfo().bonus>S.bonusClaimed)claimBonus();renderPass();render()};
$('passBar').onclick=()=>{ensureAudio();openPass()};
$('passClose').onclick=()=>{$('passModal').hidden=true};
$('passModal').addEventListener('click',e=>{if(e.target.id==='passModal')$('passModal').hidden=true});
function updPassBar(){const ti=tierInfo();$('pTier').textContent=ti.tier;$('pFill').style.width=(ti.into/ti.need*100)+'%';const c=claimable();$('passBar').classList.toggle('has',c>0);$('pDot').textContent=c}

/* ---------- slugs ---------- */
let nextSlug=now()+45000;
function spawnSlugs(){
  const scene=$('scene'),n=1+Math.floor(Math.random()*Math.min(3,1+S.seasons+(rawSps()>200?1:0)));
  for(let i=0;i<n;i++){
    const side=Math.random()<.5?-1:1,el=document.createElement('button');el.className='slug';el.setAttribute('aria-label','Schnecke verscheuchen');
    el.innerHTML='<span>🐌</span>';
    const o={el,side,x:side<0?-.02-i*.08:1.02+i*.08,born:now(),speed:.02+Math.random()*.012,target:.5+side*(.2+Math.random()*.06),y:3+Math.random()*7};
    el.style.bottom=o.y+'%';el.querySelector('span').style.transform=side<0?'scaleX(-1)':'';
    const shoo=e=>{e.preventDefault();e.stopPropagation();if(o.dead)return;o.dead=true;
      const r=Math.max(rawSps()*15,tapBase()*15,20);gain(r);S.slugs++;addXP(10);sfx.crit();buzz(15);floatText(e.clientX,e.clientY,'+'+fmt(r),'crit');
      el.style.transition='transform .4s ease-in,opacity .4s';el.style.transform=`translate(${side*-160}%,-120%) rotate(${side*-60}deg)`;el.style.opacity='0';setTimeout(()=>el.remove(),420)};
    el.addEventListener('pointerdown',shoo);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')shoo(e)});
    scene.appendChild(el);slugsArr.push(o);
  }
  toast('🐌 Schnecken im Garten!','Sie fressen deine Sporen. Tipp sie weg.');
}
function updSlugs(dt){
  for(const o of slugsArr){if(o.dead)continue;
    const d=o.target-o.x;
    if(Math.abs(d)>.005){o.x+=Math.sign(d)*Math.min(Math.abs(d),o.speed*dt)}else o.el.classList.add('eat');
    o.el.style.left=(o.x*100)+'%';
    if(has('s0')&&now()-o.born>12000){o.dead=true;o.el.style.transition='opacity .5s';o.el.style.opacity='0';setTimeout(()=>o.el.remove(),520);toast('🦔 Deine Igel haben eine Schnecke verjagt')}
  }
  slugsArr=slugsArr.filter(o=>!o.dead||o.el.isConnected);
  if(slugsArr.length&&slugsArr.every(o=>o.dead))slugsArr=[];
}

/* ---------- fireflies ---------- */
const caught={};
function flyPos(i,t){return [sr(i+30)*gw+Math.sin(t*.001+i)*22,gh*(.18+sr(i+31)*.55)+Math.cos(t*.0013+i*1.7)*16]}
$('scene').addEventListener('pointerdown',e=>{
  if(e.target.closest('.mush,.slug,.phase,.dimbtn'))return;
  const r=$('scene').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,t=reduced?0:performance.now();
  const nf=Math.min(30,own('wurm')*2);
  for(let i=0;i<nf;i++){if(caught[i]>now())continue;const [x,y]=flyPos(i,t);
    if(Math.hypot(x-px,y-py)<26){caught[i]=now()+20000;S.flies++;addXP(5);ensureAudio();
      const v=Math.max(rawSps()*3,tapBase()*3,5)*(has('f0')?3:1);gain(v);sfx.mote();buzz(10);floatText(e.clientX,e.clientY,'+'+fmt(v)+' ✨');sporeBurst(e.clientX,e.clientY,6);
      if(S.flies===1)toast('✨ Glühwürmchen gefangen!','Tipp sie im Garten an, sie bringen Bonus-Sporen');return}}
});

/* ---------- garden canvas ---------- */
const gc=$('garden'),g=gc.getContext('2d');let gw=0,gh=0,gdpr=1;
function gResize(){const r=$('scene').getBoundingClientRect();gdpr=Math.min(2,window.devicePixelRatio||1);gw=r.width;gh=r.height;gc.width=gw*gdpr;gc.height=gh*gdpr}
addEventListener('resize',gResize);
const sr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const own=id=>S.owned[id]||0;
function groundY(x){const u=(x-gw/2)/(gw/2);return gh*.86-(1-u*u)*gh*.07}

  const t=reduced?0:tt;
  g.setTransform(gdpr,0,0,gdpr,0,0);g.clearRect(0,0,gw,gh);

  const ns=Math.min(40,own('stern')*3);

  if(own('mond')){const r=14+Math.min(10,own('mond'));const gr=g.createRadialGradient(gw*.86,gh*.16,r*.5,gw*.86,gh*.16,r*2.4);gr.addColorStop(0,'rgba(255,240,190,.45)');gr.addColorStop(1,'rgba(255,240,190,0)');g.fillStyle=gr;g.fillRect(gw*.86-r*2.4,gh*.16-r*2.4,r*4.8,r*4.8);g.fillStyle='#FFF1C2';g.beginPath();g.arc(gw*.86,gh*.16,r,0,7);g.fill()}
  const nw=Math.min(8,own('wind'));g.strokeStyle='rgba(120,150,210,.45)';g.lineWidth=2;g.lineCap='round';
  for(let i=0;i<nw;i++){const x=((t*.12*(1+sr(i+3)))+sr(i)*gw)%(gw+120)-60,y=gh*(.22+sr(i+7)*.4);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+25,y-6,x+50,y);g.stroke()}

    g.globalAlpha=1;g.fillStyle='#FFB0D8';g.beginPath();g.arc(gw*.2,gh*.2,16,0,7);g.fill();g.strokeStyle='rgba(255,230,160,.8)';g.lineWidth=3;g.beginPath();g.ellipse(gw*.2,gh*.2,28,7,-.3,0,7);g.stroke()}
  if(DM.id==='wolken'){g.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<5;i++){const x=((t*.02*(1+sr(i+700)))+sr(i+710)*gw)%(gw+160)-80,y=gh*(.12+sr(i+720)*.4);g.beginPath();g.ellipse(x,y,34,12,0,0,7);g.ellipse(x+20,y-8,20,12,0,0,7);g.ellipse(x-18,y-4,16,10,0,0,7);g.fill()}}

    if(lava){g.fillStyle='rgba(255,150,40,.9)';g.beginPath();g.arc(x,y,r,0,7);g.fill()}else{g.strokeStyle='rgba(200,240,255,.8)';g.lineWidth=1.5;g.beginPath();g.arc(x,y,r,0,7);g.stroke()}}
    g.globalAlpha=1;
    if(!lava){g.strokeStyle='rgba(40,170,120,.7)';g.lineWidth=4;g.lineCap='round';for(let i=0;i<6;i++){const x=sr(i+600)*gw,y=groundY(x)+4;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.sin(t*.002+i)*12,y-25,x+Math.sin(t*.0025+i)*6,y-45-sr(i)*15);g.stroke()}}}
}

/* ---------- ui ---------- */
function toast(t,sub){const el=document.createElement('div');el.className='toast';el.innerHTML=t+(sub?`<small>${sub}</small>`:'');const box=$('toasts');box.appendChild(el);while(box.childElementCount>3)box.firstChild.remove();setTimeout(()=>el.remove(),3200)}
const modalQ=[];
function queueModal(m){modalQ.push(m);if($('modal').hidden)nextModal()}
function nextModal(){
  const m=modalQ.shift();if(!m){$('modal').hidden=true;return}
  $('mEmoji').textContent=m.emoji||'';$('mTitle').textContent=m.title;$('mText').textContent=m.text;$('mOk').textContent=m.ok;
  $('mCancel').hidden=!m.cancel;$('modal').hidden=false;$('mOk').focus();
  $('mOk').onclick=()=>{ensureAudio();m.onOk&&m.onOk();nextModal()};
  $('mCancel').onclick=()=>nextModal();
}
$('reset').addEventListener('click',()=>queueModal({emoji:'🗑️',title:'Spielstand löschen?',text:'Alles wird gelöscht, auch Erfolge und Sternensamen. Das lässt sich nicht rückgängig machen.',ok:'Löschen',cancel:true,onOk:()=>{
  try{localStorage.removeItem(LS)}catch(e){}S=fresh();bVisible=-1;uKey='';aKey='';sKey='';qKey='';updMute();applySkin();updDimBtn();checkPassSeason();render();
}}));

function render(){
  $('count').textContent=fmt(S.spores);$('sps').textContent=fmt(sps());
  $('seedsTop').hidden=S.seeds<1;$('seedsNum').textContent=S.seeds;
  const bf=[];
  if(now()<buffs.rush)bf.push(['pink',`Sporenrausch ×${rushPow()} ${Math.ceil((buffs.rush-now())/1000)} s`]);
  const ns=slugsArr.filter(o=>!o.dead).length;if(ns)bf.push(['pink',`🐌 ${ns} Schnecke${ns>1?'n':''} fressen ${100-Math.round(slugFactor()*100)} %`]);
  if(now()<buffs.frenzy)bf.push(['',`Pilzrausch ${Math.ceil((buffs.frenzy-now())/1000)} s`]);
  if(now()<buffs.tap)bf.push(['',`Tippsturm ${Math.ceil((buffs.tap-now())/1000)} s`]);
  $('buffs').innerHTML=bf.map(([c,b])=>`<span class="buff ${c}">${b}</span>`).join('');
  $('meter').style.width=(now()<buffs.rush?((buffs.rush-now())/((has('r0')?13:8)*1000))*100:meter*100)+'%';
  updBList();updUList();updQuests();updAch();updSeason();updPassBar();
  document.title=fmt(S.spores)+' Sporen – Pilzgarten';
}

function offline(){
  const el=(Date.now()-S.last)/1000;if(el<30)return;
  const t=Math.min(el,7200),amt=rawSps()*t*0.5;S.last=Date.now();if(amt<1)return;gain(amt);
  queueModal({emoji:'🌙',title:'Willkommen zurück!',text:`Dein Garten hat in ${fmtTime(t)} ${fmt(amt)} Sporen gesammelt.`,ok:'Einsammeln'});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();checkDaily();lastT=performance.now()}});
addEventListener('pagehide',save);

/* blinking face */
setInterval(()=>{if(reduced)return;const e=$('eyes');if(!e)return;e.style.transform='scaleY(.1)';e.style.transformOrigin='100px 160px';setTimeout(()=>e.style.transform='',120)},3800);

let lastT=performance.now(),uiAcc=0,achAcc=0,saveAcc=0;
function frame(t){
  const dt=Math.min((t-lastT)/1000,1);lastT=t;
  gain(sps()*dt);S.playSec+=dt;
  if(now()>=buffs.rush){meter=Math.max(0,meter-dt*.22);mush.classList.remove('rush')}
  if(now()>=nextGold){if(dim()!=='kosmos')spawnGold();scheduleGold()}
  if(now()>=nextSlug){if(S.allTime>500&&!slugsArr.length&&dim()!=='tiefsee')spawnSlugs();nextSlug=now()+55000+Math.random()*60000}
  updSlugs(dt);
  uiAcc+=dt;achAcc+=dt;saveAcc+=dt;
  if(uiAcc>0.1){uiAcc=0;render()}
  if(achAcc>0.5){achAcc=0;checkAch();checkSkins();updPhase();checkPassSeason();if(!$('passModal').hidden)renderPass()}
  if(saveAcc>8){saveAcc=0;save()}
  drawGarden(t);
  requestAnimationFrame(frame);
}
updMute();applySkin();updDimBtn();checkPassSeason();gResize();
if(!S.introSeen){S.introSeen=true;queueModal({emoji:'🍄',title:'Willkommen im Pilzgarten',text:'Tippe den Pilz an, um Sporen zu sammeln, und kauf Züchter, die für dich weitersammeln. Fang Goldpilze und Glühwürmchen, verscheuch Schnecken und schau jeden Tag für deinen Tagesbonus vorbei.',ok:'Los geht\'s'})}
offline();checkDaily();fillQuests();updPhase();render();requestAnimationFrame(frame);setTimeout(gResize,300);
})();
</script>
