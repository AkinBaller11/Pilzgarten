<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilzgarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEAF8; --bg2:#D9D0F3; --surface:#FFFFFF; --surface2:#F5F2FC;
  --ink:#2A2447; --muted:#6B6390; --line:#DDD6F0;
  --glow:#1FA89A; --amber:#D9811A; --pink:#D6457E;
  --cap1:#F79BBE; --cap2:#C9437A; --stem:#FBF3E4; --gill:#E7C9D6;
  --poor:.45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1735; --bg2:#2B2657; --surface:#26224A; --surface2:#2F2A5A;
    --ink:#EFEAFF; --muted:#A79FD0; --line:#3A3569;
    --glow:#7FE3D6; --amber:#FFB85C; --pink:#F28DB2;
    --cap1:#FF9CC4; --cap2:#B23A78; --stem:#EDE3F7; --gill:#8C5A86;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1735; --bg2:#2B2657; --surface:#26224A; --surface2:#2F2A5A;
  --ink:#EFEAFF; --muted:#A79FD0; --line:#3A3569;
  --glow:#7FE3D6; --amber:#FFB85C; --pink:#F28DB2;
  --cap1:#FF9CC4; --cap2:#B23A78; --stem:#EDE3F7; --gill:#8C5A86;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;min-height:100%;
  font-family:"Fredoka",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%) fixed,var(--bg);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px;border-radius:10px}

.top{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:12px 18px 0}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.seeds{font-size:.95rem;color:var(--muted);font-weight:500}
.seeds b{color:var(--amber)}

.layout{display:grid;grid-template-columns:1fr;gap:18px;max-width:1100px;margin:0 auto;padding:8px 16px 32px}
@media(min-width:860px){
  .layout{grid-template-columns:1fr 430px;align-items:start}
  .stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
}

.stage{text-align:center;padding-top:6px}
.count{font-size:clamp(2.4rem,9vw,3.8rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count-label{font-size:1rem;color:var(--muted);margin-top:4px}
.rate{margin-top:10px;font-size:1.05rem;font-weight:500}
.rate span{color:var(--glow)}
.buffs{min-height:34px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.buff{background:var(--amber);color:#2A1A05;font-weight:600;font-size:.9rem;padding:5px 12px;border-radius:999px}

.mush{
  display:block;margin:6px auto 0;background:none;border:0;padding:0;cursor:pointer;
  width:min(62vw,300px);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 0 22px color-mix(in srgb,var(--glow) 55%,transparent));
  animation:breathe 3.6s ease-in-out infinite;
}
.mush svg{width:100%;height:auto;display:block;pointer-events:none}
@keyframes breathe{50%{filter:drop-shadow(0 0 34px color-mix(in srgb,var(--glow) 75%,transparent))}}
.hint{color:var(--muted);font-size:.95rem;margin-top:8px}

.panel{background:var(--surface);border-radius:22px;padding:10px;box-shadow:0 1px 0 var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border-radius:16px;padding:4px}
.tab{border:0;background:none;padding:10px 4px;border-radius:12px;font-weight:500;font-size:.92rem;cursor:pointer;position:relative;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,80,.12)}
.tab .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--pink);display:none}
.tab.has .dot{display:block}
.pane{padding:10px 4px 4px}
.pane[hidden]{display:none}

.buybar{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px;color:var(--muted);font-size:.9rem}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:none;border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 6px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.row.poor{cursor:default}
.row.poor .ico,.row.poor .info,.row.poor .cost{opacity:var(--poor)}
.ico{font-size:1.9rem;width:46px;height:46px;display:grid;place-items:center;background:var(--surface2);border-radius:14px;flex:none}
.info{flex:1;min-width:0}
.info strong{display:block;font-weight:600;font-size:1.02rem}
.info small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}
.side{text-align:right;flex:none}
.cost{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--pink);margin-right:5px;vertical-align:.08em}
.own{font-size:1.5rem;font-weight:600;color:var(--muted);line-height:1}
.locked .info strong{letter-spacing:.2em}

.empty{color:var(--muted);padding:18px 8px;line-height:1.45}
.achhead{padding:4px 6px 10px;color:var(--muted)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach{background:var(--surface2);border-radius:14px;padding:10px;font-size:.85rem;line-height:1.3}
.ach .e{font-size:1.5rem}
.ach b{display:block;font-weight:600;font-size:.95rem;margin:2px 0}
.ach span{color:var(--muted)}
.ach.off{opacity:.5}
.ach.off .e{filter:grayscale(1)}

.season p{line-height:1.5;margin:0 6px 12px;max-width:60ch}
.season h3{margin:6px 6px 8px;font-size:1.25rem;font-weight:600}
.big{font-size:2rem;font-weight:600;color:var(--amber)}
.primary{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:600;font-size:1.05rem;background:var(--ink);color:var(--surface);cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--muted);margin:16px 6px 4px}

.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.float{position:absolute;font-weight:700;font-size:1.3rem;color:var(--ink);transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;text-shadow:0 0 8px var(--bg)}
@keyframes rise{to{transform:translate(-50%,-110px);opacity:0}}
.spore{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

.gold{position:fixed;z-index:25;width:74px;height:74px;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;
  filter:drop-shadow(0 0 16px var(--amber));animation:bob 1.6s ease-in-out infinite,fadein .4s ease-out}
.gold svg{width:100%;height:100%;pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes fadein{from{opacity:0;transform:scale(.4)}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,380px);pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:500;box-shadow:0 6px 20px rgba(20,10,50,.3);animation:tin .25s ease-out;width:100%;text-align:center}
.toast small{display:block;opacity:.75;font-weight:400}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(20,15,45,.55);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.card{background:var(--surface);border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center}
.card h2{margin:0 0 8px;font-weight:600}
.card p{color:var(--muted);line-height:1.5;margin:0 0 18px}
.card .ghost{margin:10px 0 0;width:100%}

@media (prefers-reduced-motion: reduce){
  .mush,.gold{animation:none}
  .spore{display:none}
  .float{animation-duration:.6s}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span aria-hidden="true">🍄</span> Pilzgarten</div>
  <div class="seeds" id="seedsTop" hidden>🌱 <b id="seedsNum">0</b> Sternensamen</div>
</header>

<main class="layout">
  <section class="stage" aria-live="off">
    <div class="count" id="count">0</div>
    <div class="count-label">Sporen</div>
    <div class="rate"><span id="sps">0</span> pro Sekunde</div>
    <div class="buffs" id="buffs"></div>
    <button class="mush" id="mush" aria-label="Pilz antippen und Sporen sammeln">
      <svg viewBox="0 0 200 220" aria-hidden="true">
        <defs>
          <radialGradient id="capg" cx="45%" cy="30%" r="75%">
            <stop offset="0" style="stop-color:var(--cap1)"/>
            <stop offset="1" style="stop-color:var(--cap2)"/>
          </radialGradient>
        </defs>
        <path d="M78 118 Q70 178 64 206 Q100 216 136 206 Q130 178 122 118 Z" style="fill:var(--stem)"/>
        <ellipse cx="91" cy="160" rx="4.5" ry="6" style="fill:#2A2447"/>
        <ellipse cx="111" cy="160" rx="4.5" ry="6" style="fill:#2A2447"/>
        <path d="M94 174 Q101 180 108 174" stroke="#2A2447" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="84" cy="170" rx="5" ry="3" style="fill:var(--cap1)" opacity=".6"/>
        <ellipse cx="118" cy="170" rx="5" ry="3" style="fill:var(--cap1)" opacity=".6"/>
        <ellipse cx="100" cy="121" rx="64" ry="11" style="fill:var(--gill)"/>
        <path d="M14 120 Q16 28 100 24 Q184 28 186 120 Q100 138 14 120 Z" fill="url(#capg)"/>
        <circle cx="60" cy="72" r="13" fill="#fff" opacity=".88"/>
        <circle cx="108" cy="52" r="9" fill="#fff" opacity=".88"/>
        <circle cx="145" cy="84" r="14" fill="#fff" opacity=".88"/>
        <circle cx="96" cy="96" r="7" fill="#fff" opacity=".88"/>
        <circle cx="36" cy="104" r="6" fill="#fff" opacity=".88"/>
        <circle cx="168" cy="110" r="6" fill="#fff" opacity=".88"/>
        <path d="M36 84 Q48 46 88 36" stroke="#fff" stroke-width="6" opacity=".3" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="hint" id="hint">Tippe den Pilz an</div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-pane="p-b">Züchter<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-u" id="tabU">Upgrades<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-a">Erfolge<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-s" id="tabS">Saison<i class="dot"></i></button>
    </div>
    <div class="pane" id="p-b">
      <div class="buybar"><span>Menge kaufen</span>
        <div class="seg"><button data-n="1" aria-pressed="true">1×</button><button data-n="10" aria-pressed="false">10×</button></div>
      </div>
      <div id="blist"></div>
    </div>
    <div class="pane" id="p-u" hidden><div id="ulist"></div></div>
    <div class="pane" id="p-a" hidden>
      <div class="achhead" id="achhead"></div>
      <div class="achgrid" id="agrid"></div>
      <button class="ghost" id="reset">Spielstand löschen</button>
    </div>
    <div class="pane season" id="p-s" hidden></div>
  </section>
</main>

<div class="fx" id="fx"></div>
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <button class="primary" id="mOk"></button>
    <button class="ghost" id="mCancel" hidden>Abbrechen</button>
  </div>
</div>

<script>
(function(){
"use strict";
const B=[
  {id:'moos',name:'Moospolster',desc:'Wächst still vor sich hin.',base:15,rate:0.1,icon:'🌿'},
  {id:'wurm',name:'Glühwürmchen',desc:'Leuchten die Sporen heraus.',base:100,rate:1,icon:'✨'},
  {id:'igel',name:'Igel-Gärtner',desc:'Schnüffelt nach reifen Pilzen.',base:1100,rate:8,icon:'🦔'},
  {id:'wind',name:'Sporenwind',desc:'Weht Sporen aus dem ganzen Wald herbei.',base:12000,rate:47,icon:'🍃'},
  {id:'myzel',name:'Myzelnetz',desc:'Verbindet jeden Pilz unter der Erde.',base:130000,rate:260,icon:'🕸️'},
  {id:'mond',name:'Mondtau',desc:'Lässt Pilze über Nacht sprießen.',base:1.4e6,rate:1400,icon:'🌙'},
  {id:'geist',name:'Waldgeist',desc:'Ein alter Freund des Gartens.',base:2e7,rate:7800,icon:'👻'},
  {id:'stern',name:'Sternenpilz',desc:'Wächst direkt aus der Milchstraße.',base:3.3e8,rate:44000,icon:'🌌'},
  {id:'ur',name:'Urpilz',desc:'Der Pilz, aus dem alle Pilze kamen.',base:5.1e9,rate:260000,icon:'🌋'}
];
const ROMAN=['I','II','III','IV','V'];
const UP=[];
B.forEach(b=>{
  [[1,10],[10,100],[25,2000],[50,6e4],[100,4e6]].forEach(([need,cm],i)=>{
    UP.push({id:b.id+i,name:b.name+' '+ROMAN[i],desc:b.name+' produziert doppelt so viel.',cost:b.base*cm,type:'b',target:b.id,
      req:s=>(s.owned[b.id]||0)>=need});
  });
});
UP.push(
  {id:'t0',name:'Flinke Finger',desc:'Tippen bringt doppelt so viel.',cost:100,type:'tapx',req:s=>s.taps>=15},
  {id:'t1',name:'Pilzgespür',desc:'Tippen bringt doppelt so viel.',cost:700,type:'tapx',req:s=>s.taps>=120},
  {id:'t2',name:'Sporenhände',desc:'Jeder Tipp bringt zusätzlich 1 % deiner Sporen pro Sekunde.',cost:12000,val:.01,type:'tappct',req:s=>s.taps>=300},
  {id:'t3',name:'Myzel-Reflex',desc:'Jeder Tipp bringt weitere 2 % deiner Sporen pro Sekunde.',cost:8e5,val:.02,type:'tappct',req:s=>s.taps>=1000},
  {id:'t4',name:'Donnerdaumen',desc:'Jeder Tipp bringt weitere 3 % deiner Sporen pro Sekunde.',cost:9e7,val:.03,type:'tappct',req:s=>s.taps>=3000},
  {id:'g0',name:'Goldnase',desc:'Goldpilze erscheinen öfter.',cost:77777,type:'goldfreq',req:s=>s.golden>=3},
  {id:'g1',name:'Langer Glanz',desc:'Goldene Effekte halten doppelt so lange.',cost:7.7e6,type:'golddur',req:s=>s.golden>=8}
);
const ACH=[
  {id:'a0',e:'👆',name:'Erster Kontakt',desc:'Tippe den Pilz an.',t:s=>s.taps>=1},
  {id:'a1',e:'🖐️',name:'Warmgetippt',desc:'Tippe 100-mal.',t:s=>s.taps>=100},
  {id:'a2',e:'🔥',name:'Tippwut',desc:'Tippe 1.000-mal.',t:s=>s.taps>=1000},
  {id:'a3',e:'⚡',name:'Unaufhaltsam',desc:'Tippe 5.000-mal.',t:s=>s.taps>=5000},
  {id:'a4',e:'🌱',name:'Grüner Daumen',desc:'Kauf deinen ersten Züchter.',t:s=>tot(s)>=1},
  {id:'a5',e:'🏡',name:'Kleiner Hof',desc:'Besitze 25 Züchter.',t:s=>tot(s)>=25},
  {id:'a6',e:'🏰',name:'Pilzimperium',desc:'Besitze 150 Züchter.',t:s=>tot(s)>=150},
  {id:'a7',e:'🧺',name:'Handvoll',desc:'Sammle insgesamt 1.000 Sporen.',t:s=>s.allTime>=1e3},
  {id:'a8',e:'🪣',name:'Eimerweise',desc:'Sammle insgesamt 100.000 Sporen.',t:s=>s.allTime>=1e5},
  {id:'a9',e:'🚚',name:'Lastwagenladung',desc:'Sammle insgesamt 10 Mio. Sporen.',t:s=>s.allTime>=1e7},
  {id:'a10',e:'🏔️',name:'Sporengebirge',desc:'Sammle insgesamt 1 Mrd. Sporen.',t:s=>s.allTime>=1e9},
  {id:'a11',e:'🪐',name:'Planetarisch',desc:'Sammle insgesamt 1 Bio. Sporen.',t:s=>s.allTime>=1e12},
  {id:'a12',e:'💨',name:'Brise',desc:'Erreiche 10 Sporen pro Sekunde.',t:()=>rawSps()>=10},
  {id:'a13',e:'🌪️',name:'Sturm',desc:'Erreiche 1.000 Sporen pro Sekunde.',t:()=>rawSps()>=1000},
  {id:'a14',e:'☄️',name:'Urgewalt',desc:'Erreiche 100.000 Sporen pro Sekunde.',t:()=>rawSps()>=1e5},
  {id:'a15',e:'🟡',name:'Glückspilz',desc:'Fang einen Goldpilz.',t:s=>s.golden>=1},
  {id:'a16',e:'🏆',name:'Goldjäger',desc:'Fang 15 Goldpilze.',t:s=>s.golden>=15},
  {id:'a17',e:'🌅',name:'Neuer Morgen',desc:'Starte deine erste neue Saison.',t:s=>s.seasons>=1},
  {id:'a18',e:'♾️',name:'Ewiger Gärtner',desc:'Starte 5 neue Saisons.',t:s=>s.seasons>=5}
];
function tot(s){let n=0;for(const k in s.owned)n+=s.owned[k];return n}

const LS='pilzgarten-v1';
function fresh(){return{spores:0,season:0,allTime:0,taps:0,owned:{},up:[],ach:[],seeds:0,golden:0,seasons:0,last:Date.now()}}
let S=fresh();
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(fresh(),JSON.parse(raw))}catch(e){}
function save(){S.last=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

const buffs={frenzy:0,tap:0};
const now=()=>Date.now();
const has=id=>S.up.includes(id);
const $=id=>document.getElementById(id);

const U=['','Tsd.','Mio.','Mrd.','Bio.','Brd.','Trill.','Trd.','Quadr.','Quadrd.','Quint.'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<10&&n%1!==0)return (Math.floor(n*10)/10).toFixed(1).replace('.',',');
  if(n<1e6)return Math.floor(n).toLocaleString('de-DE');
  const e=Math.floor(Math.log10(n)/3);
  if(e>=U.length)return n.toExponential(2).replace('.',',');
  return (n/Math.pow(10,e*3)).toFixed(2).replace('.',',')+' '+U[e];
}
function fmtTime(sec){
  if(sec<90)return Math.round(sec)+' Sekunden';
  if(sec<5400)return Math.round(sec/60)+' Minuten';
  return (sec/3600).toFixed(1).replace('.',',')+' Stunden';
}

function bRate(b){let r=b.rate;for(let i=0;i<5;i++)if(has(b.id+i))r*=2;return r}
function baseMult(){return (1+S.seeds*0.1)*(1+S.ach.length*0.03)}
function rawSps(){let t=0;for(const b of B)t+=(S.owned[b.id]||0)*bRate(b);return t*baseMult()}
function sps(){return rawSps()*(now()<buffs.frenzy?7:1)}
function tapVal(){
  let base=1,pct=0;
  for(const u of UP){if(!has(u.id))continue;if(u.type==='tapx')base*=2;if(u.type==='tappct')pct+=u.val}
  let v=base*(1+S.seeds*0.1)+sps()*pct;
  if(now()<buffs.tap)v*=50;
  return v;
}
function gain(n){S.spores+=n;S.season+=n;S.allTime+=n}
function costOf(b,k){const o=S.owned[b.id]||0,r=1.15;return Math.ceil(b.base*Math.pow(r,o)*(Math.pow(r,k)-1)/(r-1))}

/* ---------- tapping ---------- */
const mush=$('mush'),fx=$('fx');
function tap(x,y){
  const v=tapVal();gain(v);S.taps++;
  if(mush.animate)mush.animate([{transform:'scale(1)'},{transform:'scale(.93,.9)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:180});
  if(fx.childElementCount<70){
    const f=document.createElement('div');f.className='float';f.textContent='+'+fmt(v);
    f.style.left=x+'px';f.style.top=y+'px';fx.appendChild(f);f.addEventListener('animationend',()=>f.remove());
    for(let i=0;i<5;i++){
      const p=document.createElement('div');p.className='spore';
      const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
      p.style.left=x+'px';p.style.top=y+'px';
      p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-30+'px');
      fx.appendChild(p);p.addEventListener('animationend',()=>p.remove());
    }
  }
  if(S.taps===1)$('hint').textContent='Weiter so! Kauf bald deinen ersten Züchter.';
  if(S.taps===30)$('hint').textContent='Halte Ausschau nach goldenen Pilzen.';
}
mush.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY)});
mush.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=mush.getBoundingClientRect();tap(r.left+r.width/2,r.top+r.height/3)}
});

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!==t.dataset.pane);
  render(true);
}));
let buyN=1;
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  buyN=+b.dataset.n;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render(true);
}));

/* ---------- buildings ---------- */
const blist=$('blist');let bVisible=-1;
function visibleCount(){
  let n=1;
  B.forEach((b,i)=>{if((S.owned[b.id]||0)>0||S.allTime>=b.base*0.6)n=Math.max(n,i+1)});
  return Math.min(B.length,n+1);
}
function buildBList(){
  const n=visibleCount();if(n===bVisible)return;bVisible=n;blist.innerHTML='';
  B.slice(0,n).forEach((b,i)=>{
    const unlocked=(S.owned[b.id]||0)>0||S.allTime>=b.base*0.6||i===0;
    const r=document.createElement('button');r.className='row'+(unlocked?'':' locked');r.dataset.id=b.id;
    r.innerHTML=unlocked
      ?`<span class="ico" aria-hidden="true">${b.icon}</span><span class="info"><strong>${b.name}</strong><small class="ds"></small></span><span class="side"><div class="own"></div><div class="cost"></div></span>`
      :`<span class="ico" aria-hidden="true">❔</span><span class="info"><strong>???</strong><small>Sammle mehr Sporen, um diesen Züchter zu entdecken.</small></span><span class="side"><div class="cost"></div></span>`;
    if(unlocked)r.addEventListener('click',()=>{
      const c=costOf(b,buyN);if(S.spores<c)return;
      S.spores-=c;S.owned[b.id]=(S.owned[b.id]||0)+buyN;render(true);
    });
    else r.disabled=true;
    blist.appendChild(r);
  });
}
function updBList(){
  buildBList();
  blist.querySelectorAll('.row').forEach(r=>{
    const b=B.find(x=>x.id===r.dataset.id),c=costOf(b,buyN);
    r.querySelector('.cost').textContent=fmt(c);
    if(r.classList.contains('locked'))return;
    const o=S.owned[b.id]||0;
    r.querySelector('.own').textContent=o;
    r.querySelector('.ds').textContent=o?`${b.desc} Jeder bringt ${fmt(bRate(b)*baseMult())}/s.`:`${b.desc} Bringt ${fmt(bRate(b)*baseMult())}/s.`;
    r.classList.toggle('poor',S.spores<c);
    r.setAttribute('aria-label',`${b.name} kaufen für ${fmt(c)} Sporen, du hast ${o}`);
  });
}

/* ---------- upgrades ---------- */
const ulist=$('ulist');let uKey='';
function availUps(){return UP.filter(u=>!has(u.id)&&u.req(S)).sort((a,b)=>a.cost-b.cost)}
function updUList(){
  const av=availUps(),key=av.map(u=>u.id).join(',');
  if(key!==uKey){
    uKey=key;ulist.innerHTML='';
    if(!av.length)ulist.innerHTML=`<div class="empty">Gerade gibt es nichts zu verbessern. Kauf mehr Züchter oder tippe öfter, dann tauchen hier neue Upgrades auf.</div>`;
    av.forEach(u=>{
      const b=B.find(x=>x.id===u.target);
      const r=document.createElement('button');r.className='row';r.dataset.id=u.id;
      r.innerHTML=`<span class="ico" aria-hidden="true">${b?b.icon:(u.type.startsWith('g')?'🟡':'👆')}</span><span class="info"><strong>${u.name}</strong><small>${u.desc}</small></span><span class="side"><div class="cost">${fmt(u.cost)}</div></span>`;
      r.addEventListener('click',()=>{if(S.spores<u.cost)return;S.spores-=u.cost;S.up.push(u.id);render(true)});
      ulist.appendChild(r);
    });
  }
  ulist.querySelectorAll('.row').forEach(r=>{const u=UP.find(x=>x.id===r.dataset.id);r.classList.toggle('poor',S.spores<u.cost)});
  $('tabU').classList.toggle('has',av.some(u=>S.spores>=u.cost));
}

/* ---------- achievements ---------- */
let aKey='';
function checkAch(){
  ACH.forEach(a=>{if(!S.ach.includes(a.id)&&a.t(S)){S.ach.push(a.id);toast(`${a.e} Erfolg: ${a.name}`,'+3 % Produktion')}});
}
function updAch(){
  const key=S.ach.join(',');if(key===aKey)return;aKey=key;
  $('achhead').textContent=`${S.ach.length} von ${ACH.length} Erfolgen. Jeder bringt +3 % Produktion, gerade also +${S.ach.length*3} %.`;
  $('agrid').innerHTML=ACH.map(a=>{const on=S.ach.includes(a.id);
    return `<div class="ach ${on?'':'off'}"><div class="e">${on?a.e:'🔒'}</div><b>${a.name}</b><span>${a.desc}</span></div>`}).join('');
}

/* ---------- season (prestige) ---------- */
function potential(){return Math.floor(Math.sqrt(S.season/1e6))}
let sKey='';
function updSeason(){
  const p=potential(),next=Math.pow(p+1,2)*1e6;
  $('tabS').classList.toggle('has',p>=Math.max(1,S.seeds*0.5));
  const key=p+'|'+S.seeds+'|'+(Math.floor(S.season/Math.max(1,next/50)));
  if(key===sKey)return;
  sKey=key;
  $('p-s').innerHTML=`
    <h3>Neue Saison</h3>
    <p>Starte deinen Garten neu und nimm Sternensamen mit. Jeder Samen erhöht deine Produktion für immer um 10 %. Erfolge bleiben erhalten.</p>
    <p>Du hast <b>${S.seeds}</b> Sternensamen, das sind +${S.seeds*10} % Produktion.</p>
    <p>Bei einem Neustart jetzt bekommst du:<br><span class="big">🌱 ${p}</span></p>
    <p style="color:var(--muted)">Nächster Samen bei ${fmt(next)} Sporen in dieser Saison (gerade ${fmt(S.season)}).</p>
    <button class="primary" id="prestige" ${p<1?'disabled':''}>Neue Saison starten</button>`;
  const btn=$('prestige');
  if(btn)btn.addEventListener('click',()=>{
    const pp=potential();if(pp<1)return;
    modal('Neue Saison starten?',`Deine Sporen, Züchter und Upgrades werden zurückgesetzt. Du bekommst dafür ${pp} Sternensamen (+${pp*10} % Produktion für immer).`,'Neu starten',()=>{
      S.seeds+=pp;S.seasons++;S.spores=0;S.season=0;S.owned={};S.up=[];
      bVisible=-1;uKey='';sKey='';save();render(true);toast('🌅 Eine neue Saison beginnt',`+${pp} Sternensamen`);
    },true);
  });
}

/* ---------- golden mushroom ---------- */
const goldSVG=`<svg viewBox="0 0 100 100"><path d="M40 58 Q37 80 34 92 Q50 97 66 92 Q63 80 60 58Z" fill="#FFF3D6"/><path d="M8 60 Q10 14 50 12 Q90 14 92 60 Q50 70 8 60Z" fill="#FFC23D"/><circle cx="32" cy="36" r="7" fill="#FFF7E0"/><circle cx="62" cy="28" r="5" fill="#FFF7E0"/><circle cx="70" cy="46" r="6" fill="#FFF7E0"/></svg>`;
let nextGold=now()+18000;
function scheduleGold(){nextGold=now()+(35000+Math.random()*55000)/(has('g0')?1.7:1)}
function spawnGold(){
  const g=document.createElement('button');g.className='gold';g.innerHTML=goldSVG;g.setAttribute('aria-label','Goldpilz einsammeln');
  g.style.left=(6+Math.random()*80)+'vw';g.style.top=(14+Math.random()*66)+'vh';
  document.body.appendChild(g);
  const kill=setTimeout(()=>g.remove(),13000);
  const grab=e=>{e.preventDefault();clearTimeout(kill);g.remove();collectGold(e.clientX||innerWidth/2,e.clientY||innerHeight/2)};
  g.addEventListener('pointerdown',grab);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')grab(e)});
}
function collectGold(x,y){
  S.golden++;const dur=has('g1')?2:1,r=Math.random();
  if(r<0.45){const amt=Math.max(rawSps()*120,tapVal()*40,77);gain(amt);toast('🟡 Sporenregen!',`+${fmt(amt)} Sporen`)}
  else if(r<0.82){buffs.frenzy=now()+30000*dur;toast('🟡 Pilzrausch!',`7-fache Produktion für ${30*dur} Sekunden`)}
  else{buffs.tap=now()+12000*dur;toast('🟡 Tippsturm!',`Jeder Tipp zählt 50-fach für ${12*dur} Sekunden`)}
  if(fx.childElementCount<70){const f=document.createElement('div');f.className='float';f.textContent='✨';f.style.left=x+'px';f.style.top=y+'px';fx.appendChild(f);f.addEventListener('animationend',()=>f.remove())}
}

/* ---------- ui helpers ---------- */
function toast(t,sub){
  const el=document.createElement('div');el.className='toast';el.innerHTML=t+(sub?`<small>${sub}</small>`:'');
  const box=$('toasts');box.appendChild(el);while(box.childElementCount>3)box.firstChild.remove();
  setTimeout(()=>el.remove(),3200);
}
function modal(title,text,okText,onOk,cancel){
  $('mTitle').textContent=title;$('mText').textContent=text;$('mOk').textContent=okText;
  $('mCancel').hidden=!cancel;$('modal').hidden=false;$('mOk').focus();
  $('mOk').onclick=()=>{$('modal').hidden=true;onOk&&onOk()};
  $('mCancel').onclick=()=>{$('modal').hidden=true};
}
$('reset').addEventListener('click',()=>modal('Spielstand löschen?','Alles wird gelöscht, auch Erfolge und Sternensamen. Das lässt sich nicht rückgängig machen.','Löschen',()=>{
  try{localStorage.removeItem(LS)}catch(e){}S=fresh();bVisible=-1;uKey='';aKey='';sKey='';render(true);
},true));

function render(force){
  $('count').textContent=fmt(S.spores);
  $('sps').textContent=fmt(sps());
  const sTop=$('seedsTop');sTop.hidden=S.seeds<1;$('seedsNum').textContent=S.seeds;
  const bf=[];
  if(now()<buffs.frenzy)bf.push(`Pilzrausch ${Math.ceil((buffs.frenzy-now())/1000)} s`);
  if(now()<buffs.tap)bf.push(`Tippsturm ${Math.ceil((buffs.tap-now())/1000)} s`);
  $('buffs').innerHTML=bf.map(b=>`<span class="buff">${b}</span>`).join('');
  updBList();updUList();updAch();updSeason();
  document.title=fmt(S.spores)+' Sporen – Pilzgarten';
}

/* ---------- offline progress ---------- */
function offline(){
  const el=(Date.now()-S.last)/1000;if(el<30)return;
  const t=Math.min(el,7200),amt=rawSps()*t*0.5;
  S.last=Date.now();
  if(amt<1)return;
  gain(amt);
  modal('Willkommen zurück!',`Dein Garten hat in ${fmtTime(t)} ${fmt(amt)} Sporen gesammelt.`,'Einsammeln');
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();lastT=performance.now()}});
addEventListener('pagehide',save);

/* ---------- loop ---------- */
let lastT=performance.now(),uiAcc=0,achAcc=0,saveAcc=0;
function frame(t){
  const dt=Math.min((t-lastT)/1000,1);lastT=t;
  gain(sps()*dt);
  if(now()>=nextGold){spawnGold();scheduleGold()}
  uiAcc+=dt;achAcc+=dt;saveAcc+=dt;
  if(uiAcc>0.1){uiAcc=0;render()}
  if(achAcc>0.5){achAcc=0;checkAch()}
  if(saveAcc>8){saveAcc=0;save()}
  requestAnimationFrame(frame);
}
offline();render(true);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
