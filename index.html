<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilzgarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEAF8; --bg2:#D9D0F3; --surface:#FFFFFF; --surface2:#F5F2FC;
  --ink:#2A2447; --muted:#6B6390; --line:#DDD6F0;
  --glow:#1FA89A; --amber:#D9811A; --pink:#D6457E;
  --cap1:#F79BBE; --cap2:#C9437A; --stem:#FBF3E4; --gill:#E7C9D6;
  --poor:.45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1735; --bg2:#2B2657; --surface:#26224A; --surface2:#2F2A5A;
    --ink:#EFEAFF; --muted:#A79FD0; --line:#3A3569;
    --glow:#7FE3D6; --amber:#FFB85C; --pink:#F28DB2;
    --cap1:#FF9CC4; --cap2:#B23A78; --stem:#EDE3F7; --gill:#8C5A86;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1735; --bg2:#2B2657; --surface:#26224A; --surface2:#2F2A5A;
  --ink:#EFEAFF; --muted:#A79FD0; --line:#3A3569;
  --glow:#7FE3D6; --amber:#FFB85C; --pink:#F28DB2;
  --cap1:#FF9CC4; --cap2:#B23A78; --stem:#EDE3F7; --gill:#8C5A86;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;font-family:"Fredoka",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%) fixed,var(--bg);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px;border-radius:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto;padding:12px 18px 0}
.brand{font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.topr{display:flex;align-items:center;gap:10px}
.seeds{font-size:.95rem;color:var(--muted);font-weight:500}
.seeds b{color:var(--amber)}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1rem}

.layout{display:grid;grid-template-columns:1fr;gap:16px;max-width:1100px;margin:0 auto;padding:6px 14px 32px}
@media(min-width:860px){.layout{grid-template-columns:1fr 440px;align-items:start}.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}

.stage{text-align:center;padding-top:4px}
.count{font-size:clamp(2.4rem,9vw,3.8rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count-label{font-size:1rem;color:var(--muted);margin-top:4px}
.rate{margin-top:8px;font-size:1.05rem;font-weight:500}
.rate span{color:var(--glow)}
.buffs{min-height:32px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.buff{background:var(--amber);color:#2A1A05;font-weight:600;font-size:.9rem;padding:4px 12px;border-radius:999px}
.buff.pink{background:var(--pink);color:#fff}

.scene{position:relative;height:clamp(280px,48vh,380px);margin-top:4px}
#garden{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mush{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;
  width:min(56vw,250px);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 0 22px color-mix(in srgb,var(--glow) 55%,transparent));animation:breathe 3.6s ease-in-out infinite}
.mush.rush{animation:none;filter:drop-shadow(0 0 30px var(--pink)) drop-shadow(0 0 12px var(--amber))}
.mush svg{width:100%;height:auto;display:block;pointer-events:none}
@keyframes breathe{50%{filter:drop-shadow(0 0 34px color-mix(in srgb,var(--glow) 75%,transparent))}}

.meter{max-width:260px;margin:6px auto 0;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--pink));border-radius:999px;transition:width .12s}
.hint{color:var(--muted);font-size:.9rem;margin-top:6px;min-height:1.3em}

.panel{background:var(--surface);border-radius:22px;padding:10px;box-shadow:0 1px 0 var(--line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface2);border-radius:16px;padding:4px}
.tab{border:0;background:none;padding:9px 2px;border-radius:12px;font-weight:500;font-size:.82rem;cursor:pointer;position:relative;color:var(--muted);line-height:1.15}
.tab .e{display:block;font-size:1.15rem}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,80,.12)}
.tab .dot{position:absolute;top:5px;right:10%;width:9px;height:9px;border-radius:50%;background:var(--pink);display:none}
.tab.has .dot{display:block}
.pane{padding:10px 4px 4px}
.pane[hidden]{display:none}

.buybar{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px;color:var(--muted);font-size:.9rem}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:none;border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;cursor:pointer;position:relative}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.row.poor{cursor:default}
.row.poor .ico,.row.poor .info,.row.poor .cost{opacity:var(--poor)}
.ico{font-size:1.9rem;width:46px;height:46px;display:grid;place-items:center;background:var(--surface2);border-radius:14px;flex:none}
.info{flex:1;min-width:0}
.info strong{display:block;font-weight:600;font-size:1.02rem}
.info small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}
.side{text-align:right;flex:none}
.cost{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--pink);margin-right:5px;vertical-align:.08em}
.own{font-size:1.5rem;font-weight:600;color:var(--muted);line-height:1}
.prog{height:4px;border-radius:4px;background:var(--surface2);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--glow)}
.locked .info strong{letter-spacing:.2em}

.quest{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.quest:last-of-type{border-bottom:0}
.quest .info small b{color:var(--ink)}
.claim{border:0;border-radius:12px;padding:9px 14px;font-weight:600;background:var(--glow);color:#0B2B27;cursor:pointer;flex:none}
.claim:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.daily{display:flex;gap:6px;padding:12px 6px 4px}
.daily div{flex:1;text-align:center;border-radius:12px;padding:6px 0;background:var(--surface2);font-size:.75rem;color:var(--muted)}
.daily div b{display:block;font-size:1rem;color:var(--ink)}
.daily div.done{background:var(--glow);color:#0B2B27}
.daily div.done b{color:#0B2B27}
.sub{padding:12px 6px 2px;color:var(--muted);font-size:.9rem}

.empty{color:var(--muted);padding:18px 8px;line-height:1.45}
.achhead{padding:4px 6px 10px;color:var(--muted)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach{background:var(--surface2);border-radius:14px;padding:10px;font-size:.85rem;line-height:1.3}
.ach .e{font-size:1.5rem}
.ach b{display:block;font-weight:600;font-size:.95rem;margin:2px 0}
.ach span{color:var(--muted)}
.ach.off{opacity:.5}
.ach.off .e{filter:grayscale(1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:14px 6px 0;font-size:.9rem}
.stats span{color:var(--muted)}
.stats b{font-weight:600;text-align:right}

.season p{line-height:1.5;margin:0 6px 12px;max-width:60ch}
.season h3{margin:6px 6px 8px;font-size:1.25rem;font-weight:600}
.big{font-size:2rem;font-weight:600;color:var(--amber)}
.primary{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:600;font-size:1.05rem;background:var(--ink);color:var(--surface);cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--muted);margin:16px 6px 4px}

.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.float{position:absolute;font-weight:700;font-size:1.3rem;color:var(--ink);transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;text-shadow:0 0 8px var(--bg);white-space:nowrap}
.float.crit{font-size:1.9rem;color:var(--pink)}
@keyframes rise{to{transform:translate(-50%,-110px);opacity:0}}
.spore{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

.gold{position:fixed;z-index:25;width:74px;height:74px;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 0 16px var(--amber));animation:bob 1.6s ease-in-out infinite,fadein .4s ease-out}
.gold svg{width:100%;height:100%;pointer-events:none}
.mote{position:fixed;z-index:25;width:44px;height:44px;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.mote::after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,#FFF4C2,#FFB23D);box-shadow:0 0 14px #FFB23D}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes fadein{from{opacity:0;transform:scale(.4)}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,380px);pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:500;box-shadow:0 6px 20px rgba(20,10,50,.3);animation:tin .25s ease-out;width:100%;text-align:center}
.toast small{display:block;opacity:.75;font-weight:400}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(20,15,45,.55);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.card{background:var(--surface);border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center}
.card .bigemoji{font-size:3rem;line-height:1}
.card h2{margin:6px 0 8px;font-weight:600}
.card p{color:var(--muted);line-height:1.5;margin:0 0 18px}
.card .ghost{margin:10px 0 0;width:100%}


.phase{position:absolute;left:4px;top:4px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink)}
.slug{position:absolute;z-index:3;border:0;background:none;padding:0;font-size:30px;line-height:1;cursor:pointer;touch-action:manipulation;transform:translateX(-50%);width:44px;height:44px}
.slug span{display:inline-block}
.slug.eat span{animation:munch .5s ease-in-out infinite}
@keyframes munch{50%{transform:translateY(-3px) rotate(-6deg)}}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:0 0 14px;text-align:center}
.skin{border:2px solid transparent;background:var(--surface2);border-radius:16px;padding:10px 6px;cursor:pointer;font-size:.85rem;line-height:1.25}
.skin[aria-pressed="true"]{border-color:var(--glow)}
.skin:disabled{cursor:default;opacity:.55}
.skin i{display:block;width:44px;height:26px;margin:0 auto 6px;border-radius:44px 44px 8px 8px}
.skin small{display:block;color:var(--muted);font-size:.75rem}
.card.wide{max-width:460px;text-align:left}
.card.wide h2{text-align:center}
.card ul{color:var(--muted);line-height:1.5;padding-left:1.1em;margin:0 0 18px}
@media (prefers-reduced-motion: reduce){.mush,.gold{animation:none}.spore{display:none}.float{animation-duration:.6s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span aria-hidden="true">🍄</span> Pilzgarten</div>
  <div class="topr">
    <div class="seeds" id="seedsTop" hidden>🌱 <b id="seedsNum">0</b></div>
    <button class="ibtn" id="skinBtn" aria-label="Pilz-Aussehen wählen">🎨</button>
    <button class="ibtn" id="muteBtn" aria-label="Ton aus">🔊</button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="count" id="count">0</div>
    <div class="count-label">Sporen</div>
    <div class="rate"><span id="sps">0</span> pro Sekunde</div>
    <div class="buffs" id="buffs"></div>
    <div class="scene" id="scene">
      <canvas id="garden" aria-hidden="true"></canvas>
      <button class="phase" id="phase"></button>
      <button class="mush" id="mush" aria-label="Pilz antippen und Sporen sammeln">
        <svg viewBox="0 0 200 220" aria-hidden="true">
          <defs><radialGradient id="capg" cx="45%" cy="30%" r="75%"><stop offset="0" style="stop-color:var(--cap1)"/><stop offset="1" style="stop-color:var(--cap2)"/></radialGradient></defs>
          <path d="M78 118 Q70 178 64 206 Q100 216 136 206 Q130 178 122 118 Z" style="fill:var(--stem)"/>
          <g id="eyes"><ellipse cx="91" cy="160" rx="4.5" ry="6" style="fill:#2A2447"/><ellipse cx="111" cy="160" rx="4.5" ry="6" style="fill:#2A2447"/></g>
          <path id="mouth" d="M94 174 Q101 180 108 174" stroke="#2A2447" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="84" cy="170" rx="5" ry="3" style="fill:var(--cap1)" opacity=".6"/>
          <ellipse cx="118" cy="170" rx="5" ry="3" style="fill:var(--cap1)" opacity=".6"/>
          <ellipse cx="100" cy="121" rx="64" ry="11" style="fill:var(--gill)"/>
          <path d="M14 120 Q16 28 100 24 Q184 28 186 120 Q100 138 14 120 Z" fill="url(#capg)"/>
          <circle cx="60" cy="72" r="13" fill="#fff" opacity=".88"/><circle cx="108" cy="52" r="9" fill="#fff" opacity=".88"/>
          <circle cx="145" cy="84" r="14" fill="#fff" opacity=".88"/><circle cx="96" cy="96" r="7" fill="#fff" opacity=".88"/>
          <circle cx="36" cy="104" r="6" fill="#fff" opacity=".88"/><circle cx="168" cy="110" r="6" fill="#fff" opacity=".88"/>
          <path d="M36 84 Q48 46 88 36" stroke="#fff" stroke-width="6" opacity=".3" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div class="hint" id="hint">Tippe den Pilz an. Schnelles Tippen füllt den Sporenrausch.</div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-pane="p-b"><span class="e">🌿</span>Züchter<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-u" id="tabU"><span class="e">⬆️</span>Upgrades<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-q" id="tabQ"><span class="e">📜</span>Aufgaben<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-a"><span class="e">🏆</span>Erfolge<i class="dot"></i></button>
      <button class="tab" role="tab" aria-selected="false" data-pane="p-s" id="tabS"><span class="e">🌅</span>Saison<i class="dot"></i></button>
    </div>
    <div class="pane" id="p-b">
      <div class="buybar"><span>Menge kaufen</span>
        <div class="seg"><button data-n="1" aria-pressed="true">1×</button><button data-n="10" aria-pressed="false">10×</button><button data-n="max" aria-pressed="false">Max</button></div>
      </div>
      <div id="blist"></div>
    </div>
    <div class="pane" id="p-u" hidden><div id="ulist"></div></div>
    <div class="pane" id="p-q" hidden><div id="qlist"></div></div>
    <div class="pane" id="p-a" hidden>
      <div class="achhead" id="achhead"></div>
      <div class="achgrid" id="agrid"></div>
      <div class="stats" id="stats"></div>
      <button class="ghost" id="reset">Spielstand löschen</button>
    </div>
    <div class="pane season" id="p-s" hidden></div>
  </section>
</main>

<div class="modal" id="skinModal" hidden>
  <div class="card wide" role="dialog" aria-modal="true" aria-labelledby="skT">
    <h2 id="skT">Deine Pilze</h2>
    <p>Jeder freigeschaltete Pilz bringt dauerhaft +2 % Produktion.</p>
    <div class="skins" id="skinGrid"></div>
    <button class="primary" id="skinClose">Fertig</button>
  </div>
</div>
<div class="fx" id="fx"></div>
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="bigemoji" id="mEmoji"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <button class="primary" id="mOk"></button>
    <button class="ghost" id="mCancel" hidden>Abbrechen</button>
  </div>
</div>

<script>
(function(){
"use strict";
const B=[
  {id:'moos',name:'Moospolster',desc:'Wächst still vor sich hin.',base:15,rate:0.1,icon:'🌿'},
  {id:'wurm',name:'Glühwürmchen',desc:'Leuchten die Sporen heraus.',base:100,rate:1,icon:'✨'},
  {id:'igel',name:'Igel-Gärtner',desc:'Schnüffelt nach reifen Pilzen.',base:1100,rate:8,icon:'🦔'},
  {id:'wind',name:'Sporenwind',desc:'Weht Sporen aus dem ganzen Wald herbei.',base:12000,rate:47,icon:'🍃'},
  {id:'myzel',name:'Myzelnetz',desc:'Verbindet jeden Pilz unter der Erde.',base:130000,rate:260,icon:'🕸️'},
  {id:'mond',name:'Mondtau',desc:'Lässt Pilze über Nacht sprießen.',base:1.4e6,rate:1400,icon:'🌙'},
  {id:'geist',name:'Waldgeist',desc:'Ein alter Freund des Gartens.',base:2e7,rate:7800,icon:'👻'},
  {id:'stern',name:'Sternenpilz',desc:'Wächst direkt aus der Milchstraße.',base:3.3e8,rate:44000,icon:'🌌'},
  {id:'ur',name:'Urpilz',desc:'Der Pilz, aus dem alle Pilze kamen.',base:5.1e9,rate:260000,icon:'🌋'}
];
const MILE=[10,25,50,100,150,200];
const ROMAN=['I','II','III','IV','V'];
const UP=[];
B.forEach(b=>{[[1,10],[10,100],[25,2000],[50,6e4],[100,4e6]].forEach(([need,cm],i)=>{
  UP.push({id:b.id+i,name:b.name+' '+ROMAN[i],desc:b.name+' produziert doppelt so viel.',cost:b.base*cm,type:'b',target:b.id,req:s=>(s.owned[b.id]||0)>=need});
});});
UP.push(
  {id:'t0',name:'Flinke Finger',desc:'Tippen bringt doppelt so viel.',cost:100,type:'tapx',req:s=>s.taps>=15},
  {id:'t1',name:'Pilzgespür',desc:'Tippen bringt doppelt so viel.',cost:700,type:'tapx',req:s=>s.taps>=120},
  {id:'t2',name:'Sporenhände',desc:'Jeder Tipp bringt zusätzlich 1 % deiner Sporen pro Sekunde.',cost:12000,val:.01,type:'tappct',req:s=>s.taps>=300},
  {id:'t3',name:'Myzel-Reflex',desc:'Jeder Tipp bringt weitere 2 % deiner Sporen pro Sekunde.',cost:8e5,val:.02,type:'tappct',req:s=>s.taps>=1000},
  {id:'t4',name:'Donnerdaumen',desc:'Jeder Tipp bringt weitere 3 % deiner Sporen pro Sekunde.',cost:9e7,val:.03,type:'tappct',req:s=>s.taps>=3000},
  {id:'c0',name:'Glückstreffer',desc:'5 % Chance auf einen 10-fachen Tipp.',cost:4000,type:'crit',val:.05,req:s=>s.taps>=200},
  {id:'c1',name:'Volltreffer',desc:'Weitere 5 % Chance auf einen 10-fachen Tipp.',cost:2e6,type:'crit',val:.05,req:s=>s.taps>=1500},
  {id:'r0',name:'Langer Rausch',desc:'Der Sporenrausch hält 5 Sekunden länger.',cost:25000,type:'rushlen',req:s=>s.rushes>=2},

const U=['','Tsd.','Mio.','Mrd.','Bio.','Brd.','Trill.','Trd.','Quadr.','Quadrd.','Quint.'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<10&&n%1!==0)return (Math.floor(n*10)/10).toFixed(1).replace('.',',');
  if(n<1e6)return Math.floor(n).toLocaleString('de-DE');
  const e=Math.floor(Math.log10(n)/3);
  if(e>=U.length)return n.toExponential(2).replace('.',',');
  return (n/Math.pow(10,e*3)).toFixed(2).replace('.',',')+' '+U[e];
}
function fmtTime(sec){if(sec<90)return Math.round(sec)+' Sekunden';if(sec<5400)return Math.round(sec/60)+' Minuten';return (sec/3600).toFixed(1).replace('.',',')+' Stunden'}

function bRate(b){let r=b.rate;for(let i=0;i<5;i++)if(has(b.id+i))r*=2;return r*mileMult(b)*phaseMult(b.id)}
function baseMult(){return (1+S.seeds*0.1)*(1+S.ach.length*0.03)*(1+(S.skins.length-1)*0.02)}
function rawSps(){let t=0;for(const b of B)t+=(S.owned[b.id]||0)*bRate(b);return t*baseMult()}

function tapBase(){

  for(const u of UP){if(!has(u.id))continue;if(u.type==='tapx')base*=2;if(u.type==='tappct')pct+=u.val}
  let v=base*(1+S.seeds*0.1)+sps()*pct;

}

function gain(n){S.spores+=n;S.season+=n;S.allTime+=n}
function costOf(b,k){const o=S.owned[b.id]||0,r=1.15;return Math.ceil(b.base*Math.pow(r,o)*(Math.pow(r,k)-1)/(r-1))}
function maxAfford(b){const o=S.owned[b.id]||0,r=1.15,c0=b.base*Math.pow(r,o);const k=Math.floor(Math.log(S.spores*(r-1)/c0+1)/Math.log(r));return Math.max(0,k)}

let actx=null;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function tone(f,dur,type,vol,delay,slide){
  if(S.muted||!actx)return;const t0=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.1,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+.02);
}

function sporeBurst(x,y,n){if(reduced||fx.childElementCount>80)return;for(let i=0;i<n;i++){const p=document.createElement('div');p.className='spore';const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
  p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-30+'px');fx.appendChild(p);p.addEventListener('animationend',()=>p.remove())}}
function tap(x,y){
  ensureAudio();

}

  const n=visibleCount();if(n===bVisible)return;bVisible=n;blist.innerHTML='';

    if(unlocked)r.addEventListener('click',e=>{
      const k=amountFor(b),c=costOf(b,k);if(S.spores<c)return;

/* ---------- quests ---------- */
function progOf(q){
  switch(q.type){
    case 'tap':return S.taps-q.start;
    case 'buy':return (S.owned[q.target]||0)-q.start;
    case 'earn':return S.allTime-q.start;
    case 'gold':return S.golden-q.start;
    case 'rush':return S.rushes-q.start;
    case 'upg':return S.up.length-q.start;
  }return 0;
}
function questText(q){
  const b=B.find(x=>x.id===q.target);
  switch(q.type){
    case 'tap':return ['👆',`Tippe ${q.need}-mal auf den Pilz`];
    case 'buy':return [b.icon,`Kaufe ${q.need} × ${b.name}`];
    case 'earn':return ['🧺',`Sammle ${fmt(q.need)} Sporen`];
    case 'gold':return ['🟡','Fang einen Goldpilz'];
    case 'rush':return ['💫','Löse den Sporenrausch aus'];
    case 'upg':return ['⬆️','Kaufe ein Upgrade'];
  }
}
function newQuest(){
  const pool=['tap','buy','earn','earn','buy','rush'];
  if(S.golden>0)pool.push('gold');if(availUps().length)pool.push('upg');
  const used=S.quests.map(q=>q.type);let type,tries=0;
  do{type=pool[Math.random()*pool.length|0];tries++}while(used.includes(type)&&tries<12);
  const q={type,need:1,start:0,secs:60,target:null};
  if(type==='tap'){q.need=[30,60,100,150][Math.random()*4|0];q.start=S.taps;q.secs=45}
  if(type==='buy'){const vis=B.filter(b=>(S.owned[b.id]||0)>0||S.allTime>=b.base*0.6);const b=vis[Math.max(0,vis.length-1-(Math.random()*2|0))]||B[0];
    q.target=b.id;q.need=[3,5,10][Math.random()*3|0];q.start=S.owned[b.id]||0;q.secs=90}
  if(type==='earn'){q.need=Math.max(200,Math.round(rawSps()*(90+Math.random()*120)));q.start=S.allTime;q.secs=80}
  if(type==='gold'){q.start=S.golden;q.secs=180}
  if(type==='rush'){q.start=S.rushes;q.secs=70}
  if(type==='upg'){q.start=S.up.length;q.secs=60}
  return q;
}
function questReward(q){return Math.max(rawSps()*q.secs,tapBase()*q.secs*0.6,75)}
function fillQuests(){while(S.quests.length<3)S.quests.push(newQuest())}
const qlist=$('qlist');let qKey='';
function updQuests(){
  fillQuests();
  const ready=S.quests.some(q=>progOf(q)>=q.need);
  $('tabQ').classList.toggle('has',ready||dailyAvailable());
  if($('p-q').hidden)return;
  const key=S.quests.map(q=>q.type+Math.min(q.need,progOf(q))).join('|')+S.dailyStreak;
  if(key===qKey)return;qKey=key;
  let h='';
  S.quests.forEach((q,i)=>{
    const [e,t]=questText(q),p=Math.min(q.need,progOf(q)),done=p>=q.need;

/* ---------- daily ---------- */
function today(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dayIndex(v){if(!v)return null;const y=Math.floor(v/10000),m=Math.floor(v/100)%100-1,d=v%100;return Math.round(Date.UTC(y,m,d)/864e5)}
function dailyAvailable(){return S.dailyDay!==today()}
function checkDaily(){
  if(!dailyAvailable())return;
  const t=today(),prev=dayIndex(S.dailyDay),cur=dayIndex(t);
  S.dailyStreak=(prev!==null&&cur-prev===1)?S.dailyStreak+1:1;
  S.dailyDay=t;
  const d=((S.dailyStreak-1)%7)+1,amt=Math.max(100*d,rawSps()*60*d);
  gain(amt);let extra='';
  if(d===7){S.seeds++;extra=' Dazu gibt es einen Sternensamen!'}

  queueModal({emoji:d===7?'🌱':'🎁',title:`Tagesbonus: Tag ${d}`,text:`Du bekommst ${fmt(amt)} Sporen.${extra} Morgen wird der Bonus größer.`,ok:'Einsammeln',onOk:()=>sfx.gold()});
}

  if(r<0.3){const amt=Math.max(rawSps()*120,tapBase()*40,77);gain(amt);toast('🟡 Sporenregen!',`+${fmt(amt)} Sporen`);floatText(x,y,'+'+fmt(amt),'crit')}

function swarm(n){
  const motes=[];const val=Math.max(rawSps()*8,tapBase()*8,10);
  for(let i=0;i<n;i++){
    const m=document.createElement('button');m.className='mote';m.setAttribute('aria-label','Goldspore fangen');
    const o={el:m,x:Math.random()*innerWidth,y:innerHeight*(.15+Math.random()*.7),vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*3,ph:Math.random()*6};
    m.addEventListener('pointerdown',e=>{e.preventDefault();m.remove();o.dead=true;gain(val);S.motes++;sfx.mote();buzz(8);floatText(e.clientX,e.clientY,'+'+fmt(val))});
    document.body.appendChild(m);motes.push(o);
  }
  const end=now()+7000;
  (function step(){
    const t=now();
    for(const o of motes){if(o.dead)continue;
      o.ph+=.05;o.x+=o.vx+Math.sin(o.ph)*1.5;o.y+=o.vy+Math.cos(o.ph*1.3)*1.2;
      if(o.x<0||o.x>innerWidth-44)o.vx*=-1;if(o.y<40||o.y>innerHeight-60)o.vy*=-1;
      o.el.style.transform=`translate(${o.x}px,${o.y}px)`;o.el.style.left='0';o.el.style.top='0';
      if(t>end-1500)o.el.style.opacity=String(Math.max(0,(end-t)/1500));
    }
    if(t<end&&motes.some(o=>!o.dead))requestAnimationFrame(step);else motes.forEach(o=>o.el.remove());
  })();
}

/* ---------- garden canvas ---------- */
const gc=$('garden'),g=gc.getContext('2d');let gw=0,gh=0,gdpr=1;
function gResize(){const r=$('scene').getBoundingClientRect();gdpr=Math.min(2,window.devicePixelRatio||1);gw=r.width;gh=r.height;gc.width=gw*gdpr;gc.height=gh*gdpr}
addEventListener('resize',gResize);
const sr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const own=id=>S.owned[id]||0;
function groundY(x){const u=(x-gw/2)/(gw/2);return gh*.86-(1-u*u)*gh*.07}
function drawGarden(tt){
  const t=reduced?0:tt;
  g.setTransform(gdpr,0,0,gdpr,0,0);g.clearRect(0,0,gw,gh);
  const na=nightAmt();
  if(na>0){const sk=g.createLinearGradient(0,0,0,gh);sk.addColorStop(0,`rgba(20,18,70,${.35*na})`);sk.addColorStop(.85,'rgba(20,18,70,0)');g.fillStyle=sk;g.fillRect(0,0,gw,gh)}
  if(na<1){const a=1-na,sx=gw*.14,sy=gh*.15,sg=g.createRadialGradient(sx,sy,4,sx,sy,60);sg.addColorStop(0,`rgba(255,214,110,${.9*a})`);sg.addColorStop(.35,`rgba(255,200,90,${.35*a})`);sg.addColorStop(1,'rgba(255,200,90,0)');g.fillStyle=sg;g.fillRect(sx-60,sy-60,120,120)}
  const ns=Math.min(40,own('stern')*3);
  for(let i=0;i<ns;i++){g.globalAlpha=.4+.4*Math.sin(t*.002+i);g.fillStyle='#FFF6D5';g.beginPath();g.arc(sr(i+50)*gw,sr(i+80)*gh*.45,1+sr(i)*1.5,0,7);g.fill()}
  g.globalAlpha=1;
  if(own('mond')){const r=14+Math.min(10,own('mond'));const gr=g.createRadialGradient(gw*.86,gh*.16,r*.5,gw*.86,gh*.16,r*2.4);gr.addColorStop(0,'rgba(255,240,190,.45)');gr.addColorStop(1,'rgba(255,240,190,0)');g.fillStyle=gr;g.fillRect(gw*.86-r*2.4,gh*.16-r*2.4,r*4.8,r*4.8);g.fillStyle='#FFF1C2';g.beginPath();g.arc(gw*.86,gh*.16,r,0,7);g.fill()}
  const nw=Math.min(8,own('wind'));g.strokeStyle='rgba(120,150,210,.45)';g.lineWidth=2;g.lineCap='round';
  for(let i=0;i<nw;i++){const x=((t*.12*(1+sr(i+3)))+sr(i)*gw)%(gw+120)-60,y=gh*(.22+sr(i+7)*.4);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+25,y-6,x+50,y);g.stroke()}
  g.fillStyle='rgba(70,150,100,.32)';g.beginPath();g.moveTo(0,gh);g.lineTo(0,gh*.86);g.quadraticCurveTo(gw/2,gh*.72,gw,gh*.86);g.lineTo(gw,gh);g.fill();
  if(own('myzel')){g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;const n=Math.min(14,4+own('myzel'));for(let i=0;i<n;i++){const x1=sr(i+200)*gw,x2=sr(i+201)*gw;g.beginPath();g.moveTo(x1,groundY(x1)+6+sr(i)*10);g.quadraticCurveTo((x1+x2)/2,gh*.97,x2,groundY(x2)+6+sr(i+1)*10);g.stroke()}}
  const nm=Math.min(40,own('moos'));g.fillStyle='rgba(80,175,105,.8)';
  for(let i=0;i<nm;i++){const x=sr(i+10)*gw;g.beginPath();g.ellipse(x,groundY(x)+2,6+sr(i+11)*6,4+sr(i+12)*2,0,Math.PI,0);g.fill()}
  g.textAlign='center';g.textBaseline='bottom';
  const nsm=Math.min(16,Math.floor(Math.log10(S.allTime+1)*1.7));
  for(let i=0;i<nsm;i++){let x=sr(i+300)*gw;if(Math.abs(x-gw/2)<gw*.2)x=x<gw/2?x-gw*.2:x+gw*.2;x=Math.max(10,Math.min(gw-10,x));const s=12+sr(i+301)*12;g.font=s+'px serif';g.fillText('🍄',x,groundY(x)+4)}
  if(own('ur')){g.font='36px serif';g.fillText('🌋',gw*.9,groundY(gw*.9)+6)}
  const ni=Math.min(6,own('igel'));g.font='22px serif';
  for(let i=0;i<ni;i++){const ph=t*.00018*(.6+sr(i+20))+i*2.1,x=gw*(.5+.44*Math.sin(ph)),dir=Math.cos(ph)>0?-1:1;g.save();g.translate(x,groundY(x)+4);g.scale(dir,1);g.fillText('🦔',0,0);g.restore()}
  const nf=Math.min(30,own('wurm')*2);
  for(let i=0;i<nf;i++){if(caught[i]>now())continue;const [x,y]=flyPos(i,t),a=Math.min(1,(.45+.45*Math.sin(t*.004+i*3))*(.6+na*.6));
    const gr=g.createRadialGradient(x,y,0,x,y,12);gr.addColorStop(0,`rgba(255,235,130,${a})`);gr.addColorStop(1,'rgba(255,235,130,0)');g.fillStyle=gr;g.fillRect(x-12,y-12,24,24);g.fillStyle=`rgba(255,250,210,${a})`;g.beginPath();g.arc(x,y,2.2,0,7);g.fill()}
  const ng=Math.min(3,own('geist'));g.font='26px serif';
  for(let i=0;i<ng;i++){g.globalAlpha=.35+.25*Math.sin(t*.0015+i);g.fillText('👻',gw*(.15+.3*i)+Math.sin(t*.0007+i)*30,gh*(.35+.1*i)+Math.sin(t*.002+i)*8)}

function offline(){
  const el=(Date.now()-S.last)/1000;if(el<30)return;
  const t=Math.min(el,7200),amt=rawSps()*t*0.5;S.last=Date.now();if(amt<1)return;gain(amt);
  queueModal({emoji:'🌙',title:'Willkommen zurück!',text:`Dein Garten hat in ${fmtTime(t)} ${fmt(amt)} Sporen gesammelt.`,ok:'Einsammeln'});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();checkDaily();lastT=performance.now()}});
addEventListener('pagehide',save);

/* blinking face */
setInterval(()=>{if(reduced)return;const e=$('eyes');e.style.transform='scaleY(.1)';e.style.transformOrigin='100px 160px';setTimeout(()=>e.style.transform='',120)},3800);

let lastT=performance.now(),uiAcc=0,achAcc=0,saveAcc=0;
function frame(t){
  const dt=Math.min((t-lastT)/1000,1);lastT=t;
  gain(sps()*dt);S.playSec+=dt;
  if(now()>=buffs.rush){meter=Math.max(0,meter-dt*.22);mush.classList.remove('rush')}
  if(now()>=nextGold){spawnGold();scheduleGold()}
  if(now()>=nextSlug){if(S.allTime>500&&!slugsArr.length)spawnSlugs();nextSlug=now()+55000+Math.random()*60000}
  updSlugs(dt);
  uiAcc+=dt;achAcc+=dt;saveAcc+=dt;
  if(uiAcc>0.1){uiAcc=0;render()}
  if(achAcc>0.5){achAcc=0;checkAch();checkSkins();updPhase()}
  if(saveAcc>8){saveAcc=0;save()}
  drawGarden(t);
  requestAnimationFrame(frame);
}
updMute();applySkin();gResize();
if(!S.introSeen){S.introSeen=true;queueModal({emoji:'🍄',title:'Willkommen im Pilzgarten',text:'Tippe den Pilz an, um Sporen zu sammeln, und kauf Züchter, die für dich weitersammeln. Fang Goldpilze und Glühwürmchen, verscheuch Schnecken und schau jeden Tag für deinen Tagesbonus vorbei.',ok:'Los geht\'s'})}
offline();checkDaily();fillQuests();updPhase();render();requestAnimationFrame(frame);setTimeout(gResize,300);
})();
</script>
</body>
